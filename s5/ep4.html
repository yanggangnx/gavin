<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 V-Log 双原生 ISO</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 4 · 8 seconds. V-Log and its two native ISOs, 640 and 4000. A short entrance (about
// 3 s): the ISO axis draws in, each photo style's two base sensitivities land as a pair of dots
// joined by a line, V-Log last, then the headline and three facts. From B.still on the frame is a
// still chart; only the grain moves. Sources: evidence/ep4-ledger.csv (none are cited on screen).
const { ML, C, F, E, P, lerp, font, txt, rule } = S5;
const DURATION = 8;                  // the hold after the entrance; change freely, nothing moves after B.still

const B = {
  head: 0.1,                         // header
  axis: 0.35,                        // the ISO axis draws from left to right
  rows: 0.75,                        // the four photo styles, one every ROW_GAP s, V-Log last
  big: 1.85,                         // 640 / 4000
  focus: 1.95,                       // the other styles step back; V-Log's range runs out to 51200
  facts: 2.3,
  still: 3.0,                        // everything has landed
};
const ROW_GAP = 0.18;
const BEATS = [[B.axis, '坐标轴'], [B.rows + 3 * ROW_GAP, 'V-Log'], [B.big, '640 / 4000'], [B.still, '定格']];

// ---- data ------------------------------------------------------------------------------------
// D01–D02: base sensitivity of the low-ISO and the high-ISO circuit, per photo style.
const STYLES = [
  { name: '常规照片风格', low: 100, high: 640 },
  { name: 'Cinelike D2 / V2', low: 200, high: 1250 },
  { name: 'HLG', low: 400, high: 2500 },
  { name: 'V-Log', low: 640, high: 4000, self: true },
];
const VLOG_MAX = 51200;              // D04: V-Log runs from ISO 640 to 51200
const FACTS = [                      // D03–D06
  ['动态范围', '14 档以上（官方标称）'],
  ['预装', '出厂即带 V-Log，不用另购升级'],
  ['可用 ISO', '640 – 51200'],
  ['电路切换', '相机按 ISO 自动选择'],
];

// ---- layout ----------------------------------------------------------------------------------
// ISO on a log axis, one stop per tick, from the lowest base sensitivity to the top of the range.
const AX = { x0: 430, x1: 1770, y: 806, lo: 100, hi: 51200 };
const X = (iso) => AX.x0 + Math.log2(iso / AX.lo) / Math.log2(AX.hi / AX.lo) * (AX.x1 - AX.x0);
const TICKS = [100, 200, 400, 800, 1600, 3200, 6400, 12800, 25600, 51200];
const ROW_Y = (i) => 566 + i * 60;
const BIG_Y = 428;

// Hollow: the low-ISO circuit's base. Filled: the high-ISO circuit's base.
function dot(c, x, y, r, filled, color, alpha) {
  if (alpha <= 0 || r <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = filled ? color : C.bg; c.fill();
  if (!filled) { c.strokeStyle = color; c.lineWidth = 1.5; c.stroke(); }
  c.restore();
}

function line(c, x0, y0, x1, y1, color, alpha, lw = 1.5, dash) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  c.strokeStyle = color; c.lineWidth = lw;
  if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.restore();
}

// ---- the frame -------------------------------------------------------------------------------
function frame(c, u, t) {
  const rise = (a) => (1 - a) * 10;

  // Header and the two numbers.
  const head = P(t, B.head, B.head + 0.45);
  txt(c, '松下 LUMIX S5 · V-Log 的双原生 ISO', ML, 262 + rise(head), { size: 28, color: C.ink2, alpha: head });

  const n1 = P(t, B.big, B.big + 0.45), n2 = P(t, B.big + 0.15, B.big + 0.6);
  const big = { family: F.serif, size: 150, weight: 700 };
  font(c, 150, 700, F.serif);
  const w640 = c.measureText('640').width;
  font(c, 110, 600, F.serif);
  const xSlash = ML + w640 + 30, x4000 = xSlash + c.measureText('/').width + 30;
  txt(c, '640', ML, BIG_Y + rise(n1), { ...big, alpha: n1 });
  txt(c, '/', xSlash, BIG_Y + rise(n2), { family: F.serif, size: 110, weight: 600, color: C.ink3, alpha: n2 });
  txt(c, '4000', x4000, BIG_Y + rise(n2), { ...big, alpha: n2 });
  // Under each number its circuit, with the chart's symbol: this is also the legend.
  const legend = (x, s, filled, a) => {
    dot(c, x + 7, 471, 6, filled, C.ink2, a);
    txt(c, s, x + 24, 478, { size: 20, color: C.ink2, alpha: a });
  };
  legend(ML + 4, '低 ISO 电路的基准', false, P(t, B.big + 0.2, B.big + 0.6));
  legend(x4000 + 4, '高 ISO 电路的基准', true, P(t, B.big + 0.35, B.big + 0.75));

  FACTS.forEach(([label, value], i) => {
    const a = P(t, B.facts + i * 0.15, B.facts + i * 0.15 + 0.35);
    const y = 334 + i * 46 + rise(a) * 0.6;
    txt(c, label, 1130, y, { size: 24, color: C.ink3, alpha: a });
    txt(c, value, 1250, y, { size: 24, color: C.ink2, alpha: a });
  });

  // The ISO axis, drawn from left to right; each tick appears as the line passes it.
  const draw = P(t, B.axis, B.axis + 0.8);
  const xEnd = lerp(AX.x0, AX.x1, draw);
  rule(c, AX.x0, xEnd, AX.y, 1, C.ink3);
  TICKS.forEach((iso) => {
    const x = X(iso), a = Math.min(1, Math.max(0, (xEnd - x) / 60 + 1));
    c.save(); c.globalAlpha *= a; c.fillStyle = C.ink3; c.fillRect(Math.round(x), AX.y, 1, 7); c.restore();
    txt(c, String(iso), x, AX.y + 34, { size: 17, color: C.ink3, align: 'center', alpha: a });
  });
  txt(c, 'ISO（每格 1 档）', ML, AX.y + 34, { size: 17, color: C.ink3, alpha: P(t, B.axis, B.axis + 0.4) });

  // V-Log's whole range, behind its row: from 640, running out past 4000 to 51200.
  const vi = STYLES.findIndex((s) => s.self), vy = ROW_Y(vi);
  const band = P(t, B.focus, B.focus + 0.25, E.lin), run = P(t, B.focus, B.focus + 0.65);
  if (band > 0) {
    const bx = X(640), bw = lerp(X(4000), X(VLOG_MAX), run) - bx;
    c.save(); c.globalAlpha *= band; c.fillStyle = 'rgba(236,235,230,0.06)'; c.fillRect(bx, vy - 15, bw, 30); c.restore();
    txt(c, `可用至 ${VLOG_MAX}`, X(VLOG_MAX) - 12, vy + 6, { size: 16, color: C.ink3, align: 'right', alpha: P(t, B.focus + 0.5, B.focus + 0.8) });
  }
  // Drop lines from V-Log's two bases to the axis, so their place on the scale reads.
  const guide = P(t, B.focus + 0.25, B.focus + 0.6, E.lin);
  [640, 4000].forEach((iso) => line(c, X(iso), vy + 10, X(iso), AX.y - 4, C.ink3, guide * 0.7, 1, [3, 5]));

  // The four photo styles: a hollow and a filled dot joined by a line, V-Log last.
  const focus = P(t, B.focus, B.focus + 0.4);
  STYLES.forEach((s, i) => {
    const t0 = B.rows + i * ROW_GAP, y = ROW_Y(i);
    const a0 = P(t, t0, t0 + 0.2, E.out3);
    const grow = P(t, t0 + 0.1, t0 + 0.5);
    const a1 = P(t, t0 + 0.45, t0 + 0.65, E.out3);
    const dim = s.self ? 1 : lerp(1, 0.5, focus);
    const color = s.self ? C.ink : C.ink2;
    const x0 = X(s.low), x1 = X(s.high);
    txt(c, s.name, ML, y + 7, { size: 20, weight: s.self ? 500 : 400, color: s.self ? C.ink : C.ink2, alpha: a0 * dim });
    line(c, x0 + 6, y, lerp(x0 + 6, x1 - 6, grow), y, color, Math.min(1, grow * 4) * dim, s.self ? 2 : 1.5);
    dot(c, x0, y, lerp(3, s.self ? 7 : 6, a0), false, color, a0 * dim);
    dot(c, x1, y, lerp(3, s.self ? 7 : 6, a1), true, color, a1 * dim);
    const num = s.self ? { family: F.serif, size: 24, weight: 700, color: C.ink } : { size: 17, color: C.ink2 };
    txt(c, String(s.low), x0, y - 16, { ...num, align: 'center', alpha: a0 * dim });
    txt(c, String(s.high), x1, y - 16, { ...num, align: 'center', alpha: a1 * dim });
  });
}

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep4',
  duration: DURATION,
  shots: [[0, DURATION, frame]],
  vo: [],
  beats: BEATS,
  label: (t) => (t < B.still ? 'A 入场' : 'B 定格图表'),
});
</script>
</body>
</html>
