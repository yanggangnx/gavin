<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 V-Log 双原生 ISO</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 4 · 8 seconds. V-Log's two native ISOs, 640 and 4000, as two marks on V-Log's ISO
// scale. A two-second entrance (the axis draws, the two marks rise), then the frame holds still;
// only the grain moves. Sources: evidence/ep4-ledger.csv (none are cited on screen).
const { ML, C, F, P, lerp, txt, rule } = S5;
const DURATION = 8;                  // nothing moves after B.still: change the hold freely

const B = {
  head: 0.1,
  axis: 0.3,                         // the axis draws from left to right
  low: 0.8,                          // 640
  high: 1.15,                        // 4000
  still: 2.0,
};
const BEATS = [[B.axis, '坐标轴'], [B.low, '640'], [B.high, '4000'], [B.still, '定格']];

// ---- data ------------------------------------------------------------------------------------
const MARKS = [                      // D01
  { iso: 640, note: '低 ISO 电路的基准', at: B.low },
  { iso: 4000, note: '高 ISO 电路的基准', at: B.high },
];
const ISO_MAX = 51200;               // D02: V-Log runs from ISO 640 to 51200

// ---- layout ----------------------------------------------------------------------------------
// V-Log's ISO range on a log axis, so equal distances are equal numbers of stops.
const AX = { x0: ML, x1: 1770, y: 690, lo: 640, hi: ISO_MAX };
const X = (iso) => AX.x0 + Math.log2(iso / AX.lo) / Math.log2(AX.hi / AX.lo) * (AX.x1 - AX.x0);
const MARK_TOP = 530;

function frame(c, u, t) {
  const head = P(t, B.head, B.head + 0.5);
  txt(c, '松下 LUMIX S5 · V-Log 的双原生 ISO', ML, 330, { size: 28, color: C.ink2, alpha: head });

  const draw = P(t, B.axis, B.axis + 0.8);
  rule(c, AX.x0, lerp(AX.x0, AX.x1, draw), AX.y, 1, C.ink3);
  const end = P(t, B.axis + 0.6, B.axis + 1.0);
  c.save(); c.globalAlpha *= end; c.fillStyle = C.ink3; c.fillRect(AX.x1 - 1, AX.y, 1, 8); c.restore();
  txt(c, `ISO ${ISO_MAX}`, AX.x1, AX.y + 46, { size: 20, color: C.ink3, align: 'right', alpha: end });
  txt(c, '对数刻度', AX.x1, AX.y + 76, { size: 17, color: C.ink3, align: 'right', alpha: end });

  // Each native ISO: a hairline rising from the axis, its number on top and its circuit below.
  MARKS.forEach((m) => {
    const x = Math.round(X(m.iso));
    const rise = P(t, m.at, m.at + 0.5);
    const a = P(t, m.at + 0.15, m.at + 0.6);
    c.save(); c.fillStyle = C.ink2; c.fillRect(x, lerp(AX.y, MARK_TOP, rise), 1, (AX.y - MARK_TOP) * rise); c.restore();
    txt(c, String(m.iso), x - 4, MARK_TOP - 30, { family: F.serif, size: 110, weight: 700, alpha: a });
    txt(c, m.note, x, AX.y + 46, { size: 20, color: C.ink2, alpha: a });
  });
}

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep4',
  duration: DURATION,
  shots: [[0, DURATION, frame]],
  vo: [],
  beats: BEATS,
  label: (t) => (t < B.still ? 'A 入场' : 'B 定格图表'),
});
</script>
</body>
</html>
