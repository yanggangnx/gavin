<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 双 SD 卡槽</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="build/cameras.js"></script>
<script src="lib/sound.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 6 · 8 seconds. The S5's two SD slots are not the same: slot 1 takes UHS-II, slot 2 only
// UHS-I. A three-second entrance: Panasonic's side photo of the S5 with the card door open pushes
// in on the two slots and names them; on the left, the point in large type: each slot's interface
// speed and whether V90 cards get their speed there, then, small, what the difference affects.
// Then the frame holds.
// Sources: evidence/ep6-ledger.csv (none are cited on screen).
const { ML, C, F, E, P, IMG, lerp, font, txt, rule, makeCanvas } = S5;
const DURATION = 8;                  // nothing moves after B.still: change the hold freely

const B = {
  head: 0.1,
  photo: 0.2,                        // the whole side of the camera
  push: 0.7,                         // pushes in on the card slots
  slots: 1.7,                        // the two slots are outlined and named
  speed: 1.9,                        // 312 / 104 MB/s and V90, one slot every 0.3 s
  notes: 2.6,
  still: 3.2,
};
const BEATS = [[B.photo, '机身侧面'], [B.push, '推近卡槽'], [B.slots, '卡槽 1 / 2'], [B.speed, '接口速度'], [B.notes, '影响'], [B.still, '定格']];

// ---- data ------------------------------------------------------------------------------------
const PHOTO_ID = 'Panasonic_LUMIX_S5_side_slots';   // 2000 × 2000, card door open
// Each slot in photo pixels, its interface's limit (F05) and whether V90 cards get their speed (F01).
const SLOTS = [
  { rect: [530, 640, 800, 1190], name: '卡槽 1', spec: '兼容 UHS-I / UHS-II', bus: 'UHS-II', mbs: 312, v90: '可用 V90 卡' },
  { rect: [530, 1245, 800, 1795], name: '卡槽 2', spec: '兼容 UHS-I', bus: 'UHS-I', mbs: 104, v90: '用不了 V90 的速度' },
];
const NOTES = [                      // F02–F04
  ['拍视频', '最高约 25 MB/s，官方只要求 V30：两个卡槽都够'],
  ['连拍', '官方连拍数据用卡槽 1 测得：放卡槽 2，写卡更慢'],
  ['双卡备份', '一张卡不够快，两张一起停'],
];

// ---- the photo: from the whole camera to the slots ------------------------------------------------
// Start: the whole side, centred in the right half. End: a window on the slots, the slots' column
// centred in it. The window's edges and the scale interpolate together, like a push-in.
const WIN = { x: 1100, y: 190, w: 330, h: 700 };
const FOCUS = { x: 665, y: 1218 };   // the slots' column, photo pixels
const S0 = 0.34, S1 = 0.565;

let STILL = null;                    // the photo, a little desaturated as in episodes 2 and 5
function still() {
  if (!STILL && IMG[PHOTO_ID]) {
    const im = IMG[PHOTO_ID], cv = makeCanvas(im.naturalWidth, im.naturalHeight), g = cv.getContext('2d');
    g.filter = 'saturate(0.8)';
    g.drawImage(im, 0, 0);
    STILL = cv;
  }
  return STILL;
}

function view(t) {
  const p = P(t, B.push, B.push + 1.1);
  const s = Math.exp(lerp(Math.log(S0), Math.log(S1), p));
  const cx = WIN.x + WIN.w / 2, cy = WIN.y + WIN.h / 2;
  const fx = lerp(1000, FOCUS.x, p), fy = lerp(1000, FOCUS.y, p);
  const map = (x, y) => ({ x: cx + (x - fx) * s, y: cy + (y - fy) * s });
  // The clip: the whole photo at first, the window at the end.
  const a = map(0, 0), b = map(2000, 2000);
  const clip = { x: lerp(a.x, WIN.x, p), y: lerp(Math.max(a.y, 138), WIN.y, p), x1: lerp(b.x, WIN.x + WIN.w, p), y1: lerp(Math.min(b.y, 942), WIN.y + WIN.h, p) };
  return { s, map, clip };
}

function drawPhoto(c, t) {
  const a = P(t, B.photo, B.photo + 0.6, E.lin);
  if (a <= 0) return;
  const v = view(t), o = v.map(0, 0), im = still();
  c.save();
  c.globalAlpha *= a;
  c.beginPath(); c.rect(v.clip.x, v.clip.y, v.clip.x1 - v.clip.x, v.clip.y1 - v.clip.y); c.clip();
  if (im) {
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(im, o.x, o.y, 2000 * v.s, 2000 * v.s);
  } else {
    // No build/cameras.js: outline the photo and its slots instead.
    c.strokeStyle = C.ink3; c.lineWidth = 1;
    c.strokeRect(o.x, o.y, 2000 * v.s, 2000 * v.s);
  }
  c.restore();
}

// ---- the frame -------------------------------------------------------------------------------
function frame(c, u, t) {
  txt(c, '松下 LUMIX S5 · 两个 SD 卡槽', ML, 262, { size: 28, color: C.ink2, alpha: P(t, B.head, B.head + 0.5) });

  drawPhoto(c, t);

  // The two slots on the photo: an outline, a leader, the name and the manual's wording for its spec.
  const v = view(t);
  SLOTS.forEach((sl, i) => {
    const t0 = B.slots + i * 0.25;
    const a = P(t, t0, t0 + 0.4, E.lin);
    if (a <= 0) return;
    const [x0, y0, x1, y1] = sl.rect, p0 = v.map(x0, y0), p1 = v.map(x1, y1);
    c.save(); c.globalAlpha *= a; c.strokeStyle = i === 0 ? C.ink : C.ink2; c.lineWidth = 1.5;
    c.strokeRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y); c.restore();
    const ly = (p0.y + p1.y) / 2, lx = 1470;
    rule(c, p1.x, lerp(p1.x, lx - 14, P(t, t0 + 0.1, t0 + 0.45)), Math.round(ly), a, C.ink3);
    const la = P(t, t0 + 0.25, t0 + 0.6);
    txt(c, sl.name, lx, ly - 4, { size: 26, weight: 500, color: i === 0 ? C.ink : C.ink2, alpha: la });
    txt(c, sl.spec, lx, ly + 32, { size: 20, color: C.ink2, alpha: la });
  });

  // The point: each slot's interface speed, and whether a V90 card gets its speed there.
  SLOTS.forEach((sl, i) => {
    const y = 455 + i * 215, t0 = B.speed + i * 0.3;
    const a = P(t, t0, t0 + 0.45), rise = (1 - a) * 10;
    const ink = i === 0 ? C.ink : C.ink2;
    txt(c, `${sl.name} · ${sl.bus} 接口`, ML, y - 125 + rise, { size: 22, color: C.ink2, alpha: a });
    font(c, 130, 700, F.serif);
    const w = c.measureText(String(sl.mbs)).width;
    txt(c, String(sl.mbs), ML - 4, y + rise, { family: F.serif, size: 130, weight: 700, color: ink, alpha: a });
    txt(c, 'MB/s', ML + w + 14, y + rise, { size: 30, color: C.ink2, alpha: a });
    txt(c, sl.v90, 560, y + rise, { size: 34, weight: 500, color: ink, alpha: P(t, t0 + 0.15, t0 + 0.6) });
  });

  // What the difference does and does not affect, small.
  NOTES.forEach(([label, value], i) => {
    const a = P(t, B.notes + i * 0.12, B.notes + i * 0.12 + 0.4);
    const y = 772 + i * 36;
    txt(c, label, ML, y, { size: 20, color: C.ink3, alpha: a });
    txt(c, value, ML + 100, y, { size: 20, color: C.ink2, alpha: a });
  });
  txt(c, '接口速度是 SD 协会标准里的上限，实际读写看卡本身', ML, 892, { size: 16, color: C.ink3, alpha: P(t, B.notes + 0.4, B.notes + 0.8) });
}

// ---- sound -----------------------------------------------------------------------------------
// Effects only, no music (lib/sound.js); every cue sits on a beat of the picture above.
const SFX = [
  ['air', 0, { gain: 0.018 }],
  // The camera is set down; the push-in moves air towards the slots and settles on them.
  ['thump', 0.25, { gain: 0.26, pan: 0.35 }],
  ['whoosh', B.push - 0.05, { dur: 1.2, from: 90, to: 650, gain: 0.3, q: 0.8, pan: [0.15, 0.35, 1.2] }],
  ['thump', B.push + 1.1, { gain: 0.18, pan: 0.35 }],
  // Each slot is outlined with the click of a card going home.
  ...SLOTS.map((_, i) => ['latch', B.slots + i * 0.25 + 0.02, { gain: i ? 0.12 : 0.15, pan: 0.4 }]),
  // The two speeds land: 312 the big hit, 104 a smaller, higher one.
  ['hit', B.speed + 0.02, { gain: 0.9, low: 40, pan: -0.35, tail: 1.6 }],
  ['hit', B.speed + 0.32, { gain: 0.45, low: 54, pan: -0.35, tail: 0.9 }],
  // The small notes tick in underneath.
  ...NOTES.map((_, i) => ['tick', B.notes + i * 0.12 + 0.02, { gain: 0.03, tone: 2800 + i * 150, pan: -0.5 }]),
];

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep6',
  duration: DURATION,
  shots: [[0, DURATION, frame]],
  vo: [],
  beats: BEATS,
  images: window.S5_CAMERAS,
  sfx: SFX,
  label: (t) => (t < B.still ? 'A 入场' : 'B 定格图表'),
});
</script>
</body>
</html>
