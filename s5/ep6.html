<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 双 SD 卡槽</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="build/cameras.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 6 · 8 seconds. The S5's two SD slots are not the same: slot 1 takes UHS-II, slot 2 only
// UHS-I. A three-second entrance: Panasonic's side photo of the S5 with the card door open pushes
// in on the two slots and names them; on the left, a chart of the two interfaces' speed limits
// against what the S5's video needs, and what the difference does affect. Then the frame holds.
// Sources: evidence/ep6-ledger.csv (none are cited on screen).
const { ML, C, F, E, P, IMG, lerp, font, txt, rule, makeCanvas } = S5;
const DURATION = 8;                  // nothing moves after B.still: change the hold freely

const B = {
  head: 0.1,
  photo: 0.2,                        // the whole side of the camera
  push: 0.7,                         // pushes in on the card slots
  slots: 1.7,                        // the two slots are outlined and named
  chart: 1.6,                        // bars and the video marker
  notes: 2.3,
  still: 3.0,
};
const BEATS = [[B.photo, '机身侧面'], [B.push, '推近卡槽'], [B.slots, '卡槽 1 / 2'], [B.chart, '速度上限'], [B.still, '定格']];

// ---- data ------------------------------------------------------------------------------------
const PHOTO_ID = 'Panasonic_LUMIX_S5_side_slots';   // 2000 × 2000, card door open
// Each slot in photo pixels, and what the manual says it takes (F01).
const SLOTS = [
  { rect: [530, 640, 800, 1190], name: '卡槽 1', spec: 'UHS-I / UHS-II', note: '可用 V90 卡', mbs: 312, bus: 'UHS-II' },
  { rect: [530, 1245, 800, 1795], name: '卡槽 2', spec: '只支持 UHS-I', note: '', mbs: 104, bus: 'UHS-I' },
];
const VIDEO_MBS = 25;                // F02: the highest bit rate, 200 Mbps, is 25 MB/s
const NOTES = [                      // F02–F04
  ['拍视频', '最高 200 Mbps，官方只要求 V30：两个卡槽都够', false],
  ['连拍', '官方连拍张数用卡槽 1 的 UHS-II 卡测得：放卡槽 2，写卡更慢', true],
  ['双卡备份', '两张卡同时写，官方建议同速度、同容量：一张不够快，两张一起停', true],
];

// ---- the photo: from the whole camera to the slots ------------------------------------------------
// Start: the whole side, centred in the right half. End: a window on the slots, the slots' column
// centred in it. The window's edges and the scale interpolate together, like a push-in.
const WIN = { x: 1100, y: 190, w: 330, h: 700 };
const FOCUS = { x: 665, y: 1218 };   // the slots' column, photo pixels
const S0 = 0.34, S1 = 0.565;

let STILL = null;                    // the photo, a little desaturated as in episodes 2 and 5
function still() {
  if (!STILL && IMG[PHOTO_ID]) {
    const im = IMG[PHOTO_ID], cv = makeCanvas(im.naturalWidth, im.naturalHeight), g = cv.getContext('2d');
    g.filter = 'saturate(0.8)';
    g.drawImage(im, 0, 0);
    STILL = cv;
  }
  return STILL;
}

function view(t) {
  const p = P(t, B.push, B.push + 1.1);
  const s = Math.exp(lerp(Math.log(S0), Math.log(S1), p));
  const cx = WIN.x + WIN.w / 2, cy = WIN.y + WIN.h / 2;
  const fx = lerp(1000, FOCUS.x, p), fy = lerp(1000, FOCUS.y, p);
  const map = (x, y) => ({ x: cx + (x - fx) * s, y: cy + (y - fy) * s });
  // The clip: the whole photo at first, the window at the end.
  const a = map(0, 0), b = map(2000, 2000);
  const clip = { x: lerp(a.x, WIN.x, p), y: lerp(Math.max(a.y, 138), WIN.y, p), x1: lerp(b.x, WIN.x + WIN.w, p), y1: lerp(Math.min(b.y, 942), WIN.y + WIN.h, p) };
  return { s, map, clip };
}

function drawPhoto(c, t) {
  const a = P(t, B.photo, B.photo + 0.6, E.lin);
  if (a <= 0) return;
  const v = view(t), o = v.map(0, 0), im = still();
  c.save();
  c.globalAlpha *= a;
  c.beginPath(); c.rect(v.clip.x, v.clip.y, v.clip.x1 - v.clip.x, v.clip.y1 - v.clip.y); c.clip();
  if (im) {
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(im, o.x, o.y, 2000 * v.s, 2000 * v.s);
  } else {
    // No build/cameras.js: outline the photo and its slots instead.
    c.strokeStyle = C.ink3; c.lineWidth = 1;
    c.strokeRect(o.x, o.y, 2000 * v.s, 2000 * v.s);
  }
  c.restore();
}

// ---- the frame -------------------------------------------------------------------------------
function frame(c, u, t) {
  txt(c, '松下 LUMIX S5 · 两个 SD 卡槽', ML, 262, { size: 28, color: C.ink2, alpha: P(t, B.head, B.head + 0.5) });

  drawPhoto(c, t);

  // The two slots on the photo: an outline, a leader, the name and what it takes.
  const v = view(t);
  SLOTS.forEach((sl, i) => {
    const t0 = B.slots + i * 0.25;
    const a = P(t, t0, t0 + 0.4, E.lin);
    if (a <= 0) return;
    const [x0, y0, x1, y1] = sl.rect, p0 = v.map(x0, y0), p1 = v.map(x1, y1);
    c.save(); c.globalAlpha *= a; c.strokeStyle = i === 0 ? C.ink : C.ink2; c.lineWidth = 1.5;
    c.strokeRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y); c.restore();
    const ly = (p0.y + p1.y) / 2, lx = 1470;
    rule(c, p1.x, lerp(p1.x, lx - 14, P(t, t0 + 0.1, t0 + 0.45)), Math.round(ly), a, C.ink3);
    const la = P(t, t0 + 0.25, t0 + 0.6);
    txt(c, sl.name, lx, ly - 4, { size: 30, weight: 500, alpha: la });
    txt(c, sl.spec, lx, ly + 34, { size: 22, color: i === 0 ? C.ink : C.ink2, alpha: la });
    if (sl.note) txt(c, sl.note, lx, ly + 66, { size: 18, color: C.ink3, alpha: la });
  });

  // The chart: each slot's interface limit, and the most the S5's video asks for.
  const X0 = 300, K = 2.05;          // px per MB/s
  txt(c, '卡槽接口的速度上限（MB/s）', ML, 342, { size: 20, color: C.ink3, alpha: P(t, B.chart - 0.2, B.chart + 0.2) });
  SLOTS.forEach((sl, i) => {
    const y = 398 + i * 64, t0 = B.chart + i * 0.2;
    const grow = P(t, t0, t0 + 0.7), a = P(t, t0, t0 + 0.3, E.lin);
    txt(c, sl.name, ML, y + 8, { size: 22, weight: 500, alpha: a });
    txt(c, sl.bus, ML + 76, y + 8, { size: 18, color: C.ink3, alpha: a });
    const len = sl.mbs * K * grow;
    c.save(); c.globalAlpha *= a; c.fillStyle = i === 0 ? C.ink : C.ink2; c.fillRect(X0, y - 2, len, 4); c.restore();
    txt(c, String(sl.mbs), X0 + len + 14, y + 10, { family: F.serif, size: 28, weight: 700, color: i === 0 ? C.ink : C.ink2, alpha: P(t, t0 + 0.5, t0 + 0.8) });
  });
  const mx = Math.round(X0 + VIDEO_MBS * K), ma = P(t, B.chart + 0.6, B.chart + 0.9, E.lin);
  c.save(); c.globalAlpha *= ma; c.fillStyle = C.ink2;
  for (let y = 372; y < 486; y += 8) c.fillRect(mx, y, 1, 4);    // a dotted line across both bars
  c.restore();
  txt(c, `S5 视频最高 200 Mbps ≈ ${VIDEO_MBS} MB/s`, mx - 6, 518, { size: 18, color: C.ink2, alpha: ma });

  // What the difference does and does not affect.
  NOTES.forEach(([label, value, hit], i) => {
    const a = P(t, B.notes + i * 0.15, B.notes + i * 0.15 + 0.4);
    const y = 620 + i * 50;
    txt(c, label, ML, y, { size: 22, color: C.ink3, alpha: a });
    txt(c, value, ML + 110, y, { size: 22, color: hit ? C.ink : C.ink2, alpha: a });
  });
  txt(c, '速度上限按 SD 协会标准，实际读写看卡本身', ML, 850, { size: 18, color: C.ink3, alpha: P(t, B.notes + 0.6, B.notes + 1.0) });
}

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep6',
  duration: DURATION,
  shots: [[0, DURATION, frame]],
  vo: [],
  beats: BEATS,
  images: window.S5_CAMERAS,
  label: (t) => (t < B.still ? 'A 入场' : 'B 定格图表'),
});
</script>
</body>
</html>
