<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 传感器与录制规格</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 2 · 27.5 seconds: the 24.2 MP full-frame sensor is a sensible balance, but not the selling
// point; uncropped C4K / 4K 30p 4:2:2 10-bit is. Engine, player and export live in lib/stage.js;
// sources for every number on screen are in evidence/ep2-ledger.csv (none are cited on screen).
const { W, LB, ML, C, F, lerp, E, P, font, txt, rule, camera } = S5;
const DURATION = 27.5;

// Timeline in seconds, from an estimated read of about five characters a second (README).
const T = {
  s1: 0,        // S5 用的是一块 2420 万像素全画幅 CMOS
  s2: 4.85,     // 这个像素相信大家一定不陌生
  s3: 7.7,      // 因为它恰好落在一条很实用的平衡线上
  s4: 11.35,    // 照片够用，4K 视频够用，高感也不错
  s5: 15.3,     // 但什么像素、全画幅，肯定不是这台机器的真正卖点
  s6: 20.3,     // 它真正值钱的，是能够无裁切录制 C4K 或 4K 30 帧的 4:2:2 10-bit
  end: DURATION,
};
const VO = [
  [0.20, 4.60, 'S5 用的是一块 2420 万像素全画幅 CMOS。'],
  [5.00, 7.60, '这个像素相信大家一定不陌生，'],
  [7.80, 11.20, '因为它恰好落在一条很实用的平衡线上，'],
  [11.50, 15.00, '照片够用，4K 视频够用，高感也不错。'],
  [15.60, 20.00, '但什么像素、全画幅，肯定不是这台机器的真正卖点。'],
  [20.50, 26.60, '它真正值钱的，是能够无裁切录制 C4K 或 4K 30 帧的 4:2:2 10-bit。'],
];
const B = {                                      // word-level beats inside the read
  mp: 1.4, ff: 2.9, known: 5.6, line: 10.4, photo: 11.5, video: 12.6, iso: 14.0,
  px: 15.8, frame: 16.7, not: 17.9, nocrop: 22.4, c4k: 23.4, uhd: 24.2, depth: 25.4,
};
const BEATS = [[0.2, 'S5'], [B.mp, '2420 万'], [B.ff, '全画幅'], [B.known, '不陌生'], [B.line, '平衡线'],
  [B.photo, '照片'], [B.video, '4K'], [B.iso, '高感'], [B.not, '不是卖点'], [B.nocrop, '无裁切'],
  [B.c4k, 'C4K'], [B.uhd, '4K 30 帧'], [B.depth, '4:2:2 10-bit']];

// ---- data ------------------------------------------------------------------------------------
const SENSOR = { w: 35.6, h: 23.8, px: 6000, py: 4000 };   // A01
const MODELS = [                                  // ~24 MP full-frame bodies (A03)
  { name: '索尼 A7 III', year: '2018', mp: '2420 万' },
  { name: '尼康 Z6', year: '2018', mp: '2450 万' },
  { name: '松下 LUMIX S1', year: '2019', mp: '2420 万' },
  { name: '松下 LUMIX S5', year: '2020', mp: '2420 万', self: true },
  { name: '佳能 EOS R6 Mark II', year: '2022', mp: '2420 万' },
  { name: '佳能 EOS R8', year: '2023', mp: '2420 万' },
  { name: '松下 LUMIX S5II', year: '2023', mp: '2420 万' },
  { name: '尼康 Z6III', year: '2024', mp: '2450 万' },
];
const LINE = [                                    // full-frame bodies from fewest to most pixels (A04)
  { name: '索尼 A7S III', mp: 1210, width: 35.6, px: 4240 },
  { name: '松下 LUMIX S5', mp: 2420, width: 35.6, px: 6000, self: true },
  { name: '索尼 A7 IV', mp: 3300, width: 35.9, px: 7008 },
  { name: '佳能 EOS R5', mp: 4500, width: 36.0, px: 8192 },
  { name: '索尼 A7R V', mp: 6100, width: 35.7, px: 9504 },
];
const MODES = [                                   // internal MOV recording, firmware 2.0 and later (A08–A12)
  { group: '全画幅，不裁切' },
  { res: 'C4K', size: '4096×2160', fps: '30p / 25p / 24p', depth: '4:2:2 10-bit', rate: '150 Mbps', hl: 1 },
  { res: 'C4K', size: '4096×2160', fps: '30p / 25p / 24p', depth: '4:2:0 8-bit', rate: '100 Mbps' },
  { res: '4K', size: '3840×2160', fps: '30p / 25p / 24p', depth: '4:2:2 10-bit', rate: '150 Mbps', hl: 2 },
  { res: '4K', size: '3840×2160', fps: '30p / 25p / 24p', depth: '4:2:0 8-bit', rate: '100 Mbps' },
  { res: '4:3 变形', size: '3328×2496', fps: '30p / 25p / 24p', depth: '4:2:2 10-bit', rate: '150 Mbps' },
  { res: '4:3 变形', size: '3328×2496', fps: '30p / 25p / 24p', depth: '4:2:0 8-bit', rate: '100 Mbps' },
  { res: 'FHD', size: '1920×1080', fps: '60p – 24p', depth: '4:2:2 10-bit', rate: '100 Mbps' },
  { res: 'FHD', size: '1920×1080', fps: '60p – 24p', depth: '4:2:0 8-bit', rate: '100 Mbps' },
  { group: 'APS-C 裁切（约 1.5×）', crop: true },
  { res: 'C4K', size: '4096×2160', fps: '60p / 50p', depth: '4:2:0 8-bit', rate: '150 Mbps', crop: true },
  { res: '4K', size: '3840×2160', fps: '60p / 50p', depth: '4:2:0 10-bit', rate: '200 Mbps', crop: true },
  { res: '4K', size: '3840×2160', fps: '60p / 50p', depth: '4:2:0 8-bit', rate: '150 Mbps', crop: true },
  { group: '其他', crop: true },
  { res: '升格', size: 'FHD', fps: '最高 180 fps', depth: '150 / 180 fps 视角变窄', rate: '', crop: true },
  { res: 'HDMI 输出', size: '4K', fps: '60p / 50p', depth: '4:2:2 10-bit', rate: '不限时', crop: true },
  { res: 'RAW 输出', size: '5.9K', fps: '', depth: '12-bit', rate: 'Atomos Ninja V', crop: true },
];

// ---- S1 · the sensor, drawn to scale --------------------------------------------------------------
const MM = 18;                                    // px per millimetre
const SX = 1070, SY = 318, SW = SENSOR.w * MM, SH = SENSOR.h * MM;

function sensorOutline(c, draw, alpha = 1) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  const perim = 2 * (SW + SH);
  c.strokeStyle = C.ink2; c.lineWidth = 1.5;
  c.setLineDash([perim * draw, perim]);
  c.strokeRect(SX, SY, SW, SH);
  c.restore();
}

function shot1(c, t) {
  c.save();
  camera(c, lerp(1, 1.03, t / (T.s2 - T.s1)), -10 * t);
  const draw = P(t, 0.15, 1.3, E.inout3);
  sensorOutline(c, draw);

  // Dimension lines, once the outline is closed.
  const dim = P(t, 1.2, 1.6, E.lin);
  rule(c, SX, SX + SW, SY + SH + 34, dim, C.ink3);
  rule(c, SX, SX + 1, SY + SH + 26, dim, C.ink3);
  txt(c, `${SENSOR.w} mm`, SX + SW / 2, SY + SH + 70, { size: 20, color: C.ink3, align: 'center', alpha: dim });
  c.save(); c.globalAlpha *= dim; c.fillStyle = C.ink3;
  c.fillRect(SX + SW + 34, SY, 1, SH); c.fillRect(SX + SW - 1, SY + SH + 26, 1, 16); c.fillRect(SX + SW + 26, SY, 16, 1); c.fillRect(SX + SW + 26, SY + SH - 1, 16, 1);
  c.restore();
  txt(c, `${SENSOR.h} mm`, SX + SW + 50, SY + SH / 2 + 7, { size: 20, color: C.ink3, alpha: dim });

  // A magnified corner: one pixel is about 5.9 µm across.
  const mag = P(t, 3.4, 3.9, E.out3);
  if (mag > 0) {
    const src = { x: SX + 18, y: SY + 18, s: 10 };
    const box = { x: SX + SW - 290, y: SY + SH - 290, s: 220 };
    c.save();
    c.globalAlpha *= mag;
    c.strokeStyle = C.ink3; c.lineWidth = 1;
    c.strokeRect(src.x, src.y, src.s, src.s);
    c.beginPath();
    c.moveTo(src.x + src.s, src.y); c.lineTo(box.x + box.s, box.y);
    c.moveTo(src.x, src.y + src.s); c.lineTo(box.x, box.y + box.s);
    c.stroke();
    c.fillStyle = C.bg; c.fillRect(box.x, box.y, box.s, box.s);
    c.strokeStyle = C.ink2; c.strokeRect(box.x, box.y, box.s, box.s);
    c.strokeStyle = C.rule;
    for (let i = 1; i < 8; i++) {
      const d = (box.s / 8) * i;
      c.beginPath(); c.moveTo(box.x + d, box.y); c.lineTo(box.x + d, box.y + box.s);
      c.moveTo(box.x, box.y + d); c.lineTo(box.x + box.s, box.y + d); c.stroke();
    }
    c.fillStyle = C.ink2; c.fillRect(box.x + box.s / 8 * 3 + 1, box.y + box.s / 8 * 3 + 1, box.s / 8 - 1, box.s / 8 - 1);
    c.restore();
    txt(c, `单个像素约 ${(SENSOR.w / SENSOR.px * 1000).toFixed(1)} 微米`, box.x, box.y + box.s + 34, { size: 20, color: C.ink2, alpha: mag });
  }

  txt(c, '松下 LUMIX S5 的传感器', ML, 372, { size: 28, color: C.ink2 });
  const mp = P(t, B.mp - 0.05, B.mp + 0.15, E.lin);
  font(c, 190, 700, F.serif);
  const nw = c.measureText('2420').width;
  txt(c, '2420', ML, 578, { family: F.serif, size: 190, weight: 700, alpha: mp });
  txt(c, '万像素', ML + nw + 22, 578, { family: F.serif, size: 64, weight: 600, color: C.ink2, alpha: mp });
  const ff = P(t, B.ff - 0.05, B.ff + 0.15, E.lin);
  txt(c, '全画幅 CMOS', ML, 664, { family: F.serif, size: 40, weight: 600, alpha: ff });
  txt(c, `${SENSOR.px} × ${SENSOR.py}`, ML, 712, { size: 24, color: C.ink3, alpha: ff });
  c.restore();
}

// ---- S2 / S5 · the same 2420 万 down the column -------------------------------------------------
const MCOL = { name: ML, year: 780, mp: 1080, ff: 1420 };

function models(c, u, withSelf, light) {
  const list = MODELS.filter((m) => withSelf || !m.self);
  const top = withSelf ? 280 : 300, step = withSelf ? 64 : 68;
  txt(c, '机型', MCOL.name, top, { size: 20, color: C.ink3 });
  txt(c, '发布', MCOL.year, top, { size: 20, color: C.ink3 });
  txt(c, '有效像素', MCOL.mp, top, { size: 20, color: C.ink3 });
  txt(c, '画幅', MCOL.ff, top, { size: 20, color: C.ink3 });
  rule(c, ML, 1770, top + 22, 1);
  list.forEach((m, i) => {
    const a = withSelf ? 1 : P(u, 0.08 + i * 0.07, 0.26 + i * 0.07, E.out3);
    if (a <= 0) return;
    const y = top + 82 + i * step;
    const base = m.self ? 1 : light.rows;
    c.save();
    c.beginPath(); c.rect(ML - 10, y - 50, (1770 - ML + 20) * a, step); c.clip();
    txt(c, m.name, MCOL.name, y, { family: F.serif, size: 34, weight: 600, color: m.self ? C.ink : C.ink2, alpha: base });
    txt(c, m.year, MCOL.year, y, { size: 24, color: C.ink3, alpha: base });
    txt(c, m.mp, MCOL.mp, y, { family: F.serif, size: 34, weight: 600, alpha: base * light.mp });
    txt(c, '全画幅', MCOL.ff, y, { family: F.serif, size: 34, weight: 600, alpha: base * light.ff });
    c.restore();
    rule(c, ML, 1770, y + 24, a * 0.6);
  });
}

function shot2(c, t) {
  c.save();
  camera(c, lerp(1, 1.02, t / (T.s3 - T.s2)), -8 * t / (T.s3 - T.s2));
  models(c, t, false, { rows: 1, mp: 1, ff: 0.75 });
  c.restore();
}

function shot5(c, t, abs) {
  c.save();
  camera(c, lerp(1.01, 1.03, t / (T.s6 - T.s5)));
  const dim = 1 - 0.78 * P(abs, B.not, B.not + 0.5);
  c.globalAlpha = dim;
  models(c, t, true, {
    rows: 0.8,
    mp: lerp(0.75, 1, P(abs, B.px - 0.1, B.px + 0.2)),
    ff: lerp(0.6, 1, P(abs, B.frame - 0.1, B.frame + 0.2)),
  });
  c.restore();
}

// ---- S3 · the balance line --------------------------------------------------------------------
const AX = { x0: 300, x1: 1620, y: 590 };
const lx = (mp) => lerp(AX.x0, AX.x1, Math.log(mp / LINE[0].mp) / Math.log(LINE[LINE.length - 1].mp / LINE[0].mp));

function shot3(c, t, abs) {
  c.save();
  camera(c, lerp(1, 1.02, t / (T.s4 - T.s3)), 8 * t / (T.s4 - T.s3));
  txt(c, '全画幅相机的像素档位', ML, 330, { size: 28, color: C.ink2 });
  const draw = P(t, 0.1, 0.9, E.inout3);
  c.save(); c.fillStyle = C.ink3; c.fillRect(AX.x0 - 60, AX.y, (AX.x1 - AX.x0 + 120) * draw, 1); c.restore();

  const self = P(abs, B.line - 0.1, B.line + 0.3);
  LINE.forEach((m, i) => {
    const a = P(t, 0.4 + i * 0.12, 0.65 + i * 0.12, E.out3);
    if (a <= 0) return;
    const x = lx(m.mp);
    const hi = m.self ? self : 0;
    c.save(); c.globalAlpha *= a; c.fillStyle = m.self ? C.ink : C.ink2;
    c.beginPath(); c.arc(x, AX.y, m.self ? lerp(5, 7, hi) : 5, 0, Math.PI * 2); c.fill(); c.restore();
    txt(c, m.name, x, AX.y - 92, { size: 22, color: m.self ? C.ink : C.ink3, align: 'center', alpha: a });
    txt(c, `${m.mp} 万`, x, AX.y - 40, { family: F.serif, size: m.self ? 40 : 34, weight: 600, color: m.self ? C.ink : C.ink2, align: 'center', alpha: a });
    txt(c, `单个像素约 ${(m.width / m.px * 1000).toFixed(1)} 微米`, x, AX.y + 48, { size: 19, color: C.ink3, align: 'center', alpha: a });
    if (m.self) {
      c.save(); c.globalAlpha *= hi; c.fillStyle = C.ink2;
      c.fillRect(x, AX.y - 140 + 18, 1, 26); c.fillRect(x, AX.y + 70, 1, 26); c.restore();
    }
  });
  const ends = P(t, 1.1, 1.5, E.lin);
  txt(c, '← 单个像素更大', AX.x0 - 60, AX.y + 160, { size: 22, color: C.ink3, alpha: ends });
  txt(c, '细节更多 →', AX.x1 + 60, AX.y + 160, { size: 22, color: C.ink3, align: 'right', alpha: ends });
  c.restore();
}

// ---- S4 · enough for photos, enough for 4K, good at high ISO ----------------------------------
const FACTS = [
  { at: B.photo, label: '照片', value: '6000 × 4000', note: '按 300 dpi 可印约 51 × 34 厘米' },
  { at: B.video, label: '4K 视频', value: '3840 × 2160', note: `只用到传感器宽度的 ${Math.round(3840 / SENSOR.px * 100)}%` },
  { at: B.iso, label: '高感', value: 'ISO 640 / 4000', note: '双原生 ISO（V-Log）' },
];

function shot4(c, t, abs) {
  c.save();
  camera(c, lerp(1, 1.018, t / (T.s5 - T.s4)));
  FACTS.forEach((f, i) => {
    const a = P(abs, f.at - 0.08, f.at + 0.12, E.lin);
    const x = ML + i * 560;
    rule(c, x, x + 480, 420, a, C.ink3);
    txt(c, f.label, x, 470, { size: 26, color: C.ink2, alpha: a });
    txt(c, f.value, x, 560, { family: F.serif, size: 56, weight: 600, alpha: a });
    txt(c, f.note, x, 616, { size: 22, color: C.ink3, alpha: a });
  });
  c.restore();
}

// ---- S6 · every recording mode, then the two that matter --------------------------------------
const RCOL = { res: ML + 24, size: 420, fps: 700, depth: 1060, rate: 1400 };

function shot6(c, t, abs) {
  c.save();
  // Settle, then push slowly towards the two rows that matter so they read on a phone.
  const push = P(abs, B.c4k, T.end - 0.3, E.inout3);
  camera(c, lerp(1, 1.015, t / (T.end - T.s6)) * lerp(1, 1.12, push), lerp(0, 60, push), lerp(0, 150, push));
  txt(c, '松下 LUMIX S5 机内录制规格（MOV，固件 2.0 起）', ML, 200, { size: 24, color: C.ink2 });
  const nocrop = P(abs, B.nocrop - 0.1, B.nocrop + 0.3);
  const hl1 = P(abs, B.c4k - 0.08, B.c4k + 0.2), hl2 = P(abs, B.uhd - 0.08, B.uhd + 0.2);
  const depth = P(abs, B.depth - 0.08, B.depth + 0.25);
  const focus = Math.max(hl1, hl2);
  let y = 248;
  MODES.forEach((m, i) => {
    const a = P(t, 0.05 + i * 0.03, 0.2 + i * 0.03, E.out3);
    if (m.group) {
      y += i ? 14 : 0;
      const g = m.crop ? lerp(1, 0.35, nocrop) : 1;
      txt(c, m.group, ML, y + 22, { size: 20, weight: 500, color: m.crop ? C.ink3 : C.ink2, alpha: a * g * lerp(1, 0.6, focus) });
      rule(c, ML, 1770, y + 34, a * 0.6);
      y += 42;
      return;
    }
    const hl = m.hl === 1 ? hl1 : m.hl === 2 ? hl2 : 0;
    let base = m.crop ? lerp(0.85, 0.3, nocrop) : 0.85;
    base *= lerp(1, m.hl ? 1 : 0.24, focus);
    if (hl > 0) {
      c.save(); c.globalAlpha = hl * 0.07; c.fillStyle = C.ink;
      c.fillRect(ML - 6, y + 2, 1770 - ML + 12, 34); c.restore();
    }
    const col = hl > 0 ? C.ink : C.ink2;
    const o = { size: 21, alpha: a * Math.max(base, hl), color: col };
    txt(c, m.res, RCOL.res, y + 27, { ...o, weight: 500 });
    txt(c, m.size, RCOL.size, y + 27, o);
    txt(c, m.fps, RCOL.fps, y + 27, o);
    txt(c, m.depth, RCOL.depth, y + 27, { ...o, weight: m.hl ? 500 : 400 });
    if (m.hl && depth > 0) {
      font(c, 21, 500, F.sans);
      rule(c, RCOL.depth, RCOL.depth + c.measureText(m.depth).width, y + 33, depth, C.ink);
    }
    txt(c, m.rate, RCOL.rate, y + 27, o);
    y += 38;
  });
  c.restore();
}

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep2',
  duration: DURATION,
  shots: [
    [T.s1, T.s2, shot1], [T.s2, T.s3, shot2], [T.s3, T.s4, shot3],
    [T.s4, T.s5, shot4], [T.s5, T.s6, shot5], [T.s6, T.end, shot6],
  ],
  vo: VO,
  beats: BEATS,
});
</script>
</body>
</html>
