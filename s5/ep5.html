<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 防抖</title>
</head>
<body>
<script src="fonts/fonts.js"></script>
<script src="vendor/mp4-muxer-5.2.2.js"></script>
<script src="vendor/webm-muxer-5.1.4.js"></script>
<script src="build/cameras.js"></script>
<script src="lib/sound.js"></script>
<script src="lib/stage.js"></script>
<script>
'use strict';
// Episode 5 · 15.5 seconds, three shots joined by short crossfades. 1: the S5's stabilization
// settings, beside a sketch of sensor-shift stabilization (the mount shakes, the sensor holds
// still). 2: body alone against body plus lens, side by side: a photo of each, 5 stops against
// 6.5, what that means for the shutter, and one bar per column on the same scale. 3: the two
// video options, E-Stabilization (Video) and Boost I.S. (Video), side by side. Each shot has a
// short entrance and then holds. Sources: evidence/ep5-ledger.csv (none are cited on screen).
const { ML, C, F, E, P, IMG, lerp, font, txt, rule, makeCanvas } = S5;

const T = [0, 4.5, 9.5, 15.5];       // shot starts and the end
const DURATION = T[3];
const XF = 0.4;                      // crossfade between shots
const BEATS = [[T[0] + 0.3, '防抖设置'], [T[1], '6.5 档'], [T[2], '视频防抖']];

// ---- data ------------------------------------------------------------------------------------
const SETTINGS = [                   // E01–E05
  ['机身防抖', '5 轴传感器位移，单独约 5 档'],
  ['搭配防抖镜头', 'Dual I.S. 2，合计约 6.5 档'],
  ['工作模式', '普通 / 摇摄 / 关'],
  ['电子防抖（视频）', '开 / 关'],
  ['Boost I.S.（视频）', '开 / 关'],
];
// E01, E02, E06: the two columns of shot 2. img: a key of build/cameras.js (assets/cameras/).
const COMPARE = [
  { title: '只有机身防抖', lens: '机身内 5 轴传感器位移', img: 'Panasonic_LUMIX_S5', box: { w: 320, h: 232 }, stops: 5, num: '5',
    times: '快门可以慢 32 倍', example: '例：60 mm 手持，1/60 秒 → 约 1/2 秒', test: 'CIPA 标准，用无防抖的 S-R2060 镜头测得' },
  { title: '机身 + 镜头一起防抖（Dual I.S. 2）', lens: '镜头也带 O.I.S. 防抖（图为 S-R24105）', img: 'Panasonic_LUMIX_S5_with_S-R24105', box: { w: 300, h: 262 }, stops: 6.5, num: '6.5',
    times: '快门可以慢约 90 倍', example: '例：200 mm 手持，1/200 秒 → 约 1/2 秒', test: 'CIPA 标准，用 S-E70200 镜头测得', self: true },
];
const MODES = [                      // E04, E05
  { title: '电子防抖（视频）', lines: ['机身、镜头、电子三者一起修正 5 个方向', '构图可以移动', '画面会裁掉一圈，视角变窄'], crop: true },
  { title: 'Boost I.S.（视频）', lines: ['加大机身防抖的力度', '只适合固定机位、构图不动', '要改构图先关掉；焦距越长，效果越弱'] },
];

// ---- helpers ---------------------------------------------------------------------------------
// How visible shot i is: in at its start, out over the crossfade into the next one.
const shotA = (t, i) => (i === 0 ? 1 : P(t, T[i] - 0.05, T[i] + XF, E.lin)) * (i === 2 ? 1 : 1 - P(t, T[i + 1] - XF, T[i + 1] + 0.05, E.lin));
// Handheld shake, a fixed sum of sines so every frame is reproducible.
const shake = (t, amp) => ({
  x: amp * (0.6 * Math.sin(t * 7.3) + 0.4 * Math.sin(t * 13.1 + 1.3)),
  y: amp * (0.6 * Math.sin(t * 6.1 + 0.7) + 0.4 * Math.sin(t * 15.7 + 2.1)),
});

function box(c, x, y, w, h, color, lw, alpha) {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha *= alpha; c.strokeStyle = color; c.lineWidth = lw; c.strokeRect(x, y, w, h); c.restore();
}
function bar(c, x0, x1, y, h, color, alpha) {
  if (alpha <= 0 || x1 <= x0) return;
  c.save(); c.globalAlpha *= alpha; c.fillStyle = color; c.fillRect(x0, y - h / 2, x1 - x0, h); c.restore();
}

// ---- shot 1 · the settings ---------------------------------------------------------------------
const MOUNT = { x: 1400, y: 560, mm: 10 };      // L-mount opening 51.6 mm, sensor 35.6 × 23.8 mm

function shot1(c, t, A) {
  const l = t - T[0];
  txt(c, '松下 LUMIX S5 · 防抖', ML, 262, { size: 28, color: C.ink2, alpha: A * P(l, 0.1, 0.5) });
  SETTINGS.forEach(([name, value], i) => {
    const a = A * P(l, 0.35 + i * 0.12, 0.75 + i * 0.12);
    const y = 372 + i * 62;
    txt(c, name, ML, y, { size: 24, alpha: a });
    txt(c, value, 470, y, { size: 24, color: C.ink2, alpha: a });
  });

  // Sensor-shift stabilization: the mount (the body) shakes, the sensor stays where it is.
  const a = A * P(l, 0.4, 1.0, E.lin);
  if (a > 0) {
    const s = shake(t, 9 * P(l, 1.0, 1.6));
    const r = 51.6 / 2 * MOUNT.mm, sw = 35.6 * MOUNT.mm, sh = 23.8 * MOUNT.mm;
    c.save(); c.globalAlpha *= a; c.strokeStyle = C.ink3; c.lineWidth = 1;
    c.beginPath(); c.arc(MOUNT.x + s.x, MOUNT.y + s.y, r, 0, Math.PI * 2); c.stroke(); c.restore();
    box(c, MOUNT.x - sw / 2, MOUNT.y - sh / 2, sw, sh, C.ink2, 1.5, a);
    txt(c, '机身在晃，传感器反向移动抵消', MOUNT.x, MOUNT.y + r + 52, { size: 18, color: C.ink3, align: 'center', alpha: A * P(l, 1.2, 1.6) });
  }
}

// ---- shot 2 · body alone against body + lens -------------------------------------------------------
const COLS = [ML, 1010];
// Each photo fits its column's box, bottom-left aligned. The boxes differ so the two bodies come
// out about the same size: the angled photo's box also has to hold the lens.
const PHOTO = { bottom: 656, numX: 400 };
const PER_STOP = 85;                             // the same scale for both bars
const BAR_Y = 702;

// The photos, a little desaturated as in episode 2, and the box their opaque pixels fill.
const STILL = {};
function still(id) {
  if (!STILL[id] && IMG[id]) {
    const im = IMG[id], w = im.naturalWidth, h = im.naturalHeight;
    const cv = makeCanvas(w, h), g = cv.getContext('2d');
    g.filter = 'saturate(0.8)';
    g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 128) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    }
    STILL[id] = { cv, x0, y0, x1: x1 + 1, y1: y1 + 1 };
  }
  return STILL[id];
}

function photo(c, id, box, x, alpha) {
  if (alpha <= 0) return;
  const p = still(id);
  c.save();
  c.globalAlpha *= alpha;
  if (p) {
    const s = Math.min(box.w / (p.x1 - p.x0), box.h / (p.y1 - p.y0));
    const w = (p.x1 - p.x0) * s, h = (p.y1 - p.y0) * s, y = PHOTO.bottom - h;
    // A faint pool of light, so the black body separates from the black background.
    c.save();
    c.translate(x + w / 2, y + h * 0.55); c.scale(1, 0.62);
    const r = w * 0.78, pool = c.createRadialGradient(0, 0, 0, 0, 0, r);
    pool.addColorStop(0, 'rgba(236,235,230,0.07)'); pool.addColorStop(1, 'rgba(236,235,230,0)');
    c.fillStyle = pool; c.fillRect(-r, -r, 2 * r, 2 * r);
    c.restore();
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(p.cv, x - p.x0 * s, y - p.y0 * s, p.cv.width * s, p.cv.height * s);
  } else {
    // The photo is not in assets/cameras/ yet: mark its place.
    c.strokeStyle = C.ink3; c.lineWidth = 1; c.setLineDash([4, 6]);
    c.strokeRect(x, PHOTO.bottom - box.h, box.w, box.h);
    c.setLineDash([]);
    txt(c, '待放入照片', x + box.w / 2, PHOTO.bottom - box.h / 2 + 7, { size: 18, color: C.ink3, align: 'center' });
  }
  c.restore();
}

function shot2(c, t, A) {
  const l = t - T[1];
  txt(c, '防抖档数对比', ML, 262, { size: 28, color: C.ink2, alpha: A * P(l, 0.1, 0.5) });

  COMPARE.forEach((m, i) => {
    const x = COLS[i], t0 = 0.3 + i * 1.1;                  // the right column follows the left
    const at = (a, b) => A * P(l, t0 + a, t0 + b);
    txt(c, m.title, x, 338, { size: 30, weight: 500, alpha: at(0, 0.45) });
    txt(c, m.lens, x, 378, { size: 20, color: C.ink2, alpha: at(0.1, 0.55) });
    photo(c, m.img, m.box, x, A * P(l, t0 + 0.15, t0 + 0.65, E.lin));

    // The number and what it means for the shutter.
    const nx = x + PHOTO.numX, na = at(0.4, 0.85);
    font(c, 120, 700, F.serif);
    const w = c.measureText(m.num).width;
    txt(c, m.num, nx, 560, { family: F.serif, size: 120, weight: 700, alpha: na });
    txt(c, '档', nx + w + 14, 560, { family: F.serif, size: 46, weight: 600, color: C.ink2, alpha: na });
    txt(c, m.times, nx, 612, { size: 24, alpha: at(0.55, 0.95) });

    // One bar per column on the same scale, a tick per stop. On the right, the stops it adds
    // beyond the body alone are drawn brighter.
    const grow = P(l, t0 + 0.5, t0 + 1.2);
    const len = m.stops * PER_STOP * grow;
    bar(c, x, x + Math.min(len, 5 * PER_STOP), BAR_Y, 3, C.ink2, A);
    if (len > 5 * PER_STOP) bar(c, x + 5 * PER_STOP, x + len, BAR_Y, 3, C.ink, A);
    for (let s = 1; s <= Math.floor(m.stops); s++) {
      const ta = A * Math.min(1, Math.max(0, (len - s * PER_STOP) / 20 + 1));
      c.save(); c.globalAlpha *= ta; c.fillStyle = C.ink3; c.fillRect(x + s * PER_STOP, BAR_Y + 4, 1, 7); c.restore();
    }
    if (m.self) txt(c, '多 1.5 档', x + 5.75 * PER_STOP, BAR_Y - 14, { size: 18, color: C.ink2, align: 'center', alpha: at(1.1, 1.4) });

    txt(c, m.example, x, 770, { size: 22, color: C.ink2, alpha: at(0.9, 1.3) });
    txt(c, m.test, x, 808, { size: 18, color: C.ink3, alpha: at(1.0, 1.4) });
  });
  txt(c, 'Dual I.S. 2 需要支持它的松下镜头，如 S-R24105、S-E70200、S-R70200；每格 1 档，快门时间翻一倍', ML, 872, { size: 18, color: C.ink3, alpha: A * P(l, 2.6, 3.0) });
}

// ---- shot 3 · the two video options ------------------------------------------------------------
const FRAME = { w: 560, h: 315, y: 400, cols: [ML, 1010] };

function shot3(c, t, A) {
  const l = t - T[2];
  txt(c, '视频防抖的两个选项', ML, 262, { size: 28, color: C.ink2, alpha: A * P(l, 0.1, 0.5) });
  MODES.forEach((m, i) => {
    const x = FRAME.cols[i], t0 = 0.3 + i * 0.35;
    const a = A * P(l, t0, t0 + 0.45);
    txt(c, m.title, x, 358, { size: 30, weight: 500, alpha: a });
    const fa = A * P(l, t0 + 0.2, t0 + 0.7, E.lin);
    if (m.crop) {
      // Electronic: the sensor's picture shakes; the recorded window inside it stays put, and the
      // margin it moves in is cut off.
      const s = shake(t, 10 * P(l, t0 + 0.8, t0 + 1.3));
      const k = 0.86, iw = FRAME.w * k, ih = FRAME.h * k;
      box(c, x + s.x, FRAME.y + s.y, FRAME.w, FRAME.h, C.ink3, 1, fa);
      box(c, x + (FRAME.w - iw) / 2, FRAME.y + (FRAME.h - ih) / 2, iw, ih, C.ink, 1.5, fa);
      txt(c, '传感器画面', x + s.x + FRAME.w, FRAME.y + s.y - 12, { size: 16, color: C.ink3, align: 'right', alpha: fa });
      txt(c, '录下的画面', x + (FRAME.w - iw) / 2 + 12, FRAME.y + (FRAME.h - ih) / 2 + 28, { size: 16, color: C.ink2, alpha: fa });
    } else {
      // Boost: the whole frame, held still; a small cross marks the fixed composition.
      box(c, x, FRAME.y, FRAME.w, FRAME.h, C.ink, 1.5, fa);
      const cx = x + FRAME.w / 2, cy = FRAME.y + FRAME.h / 2;
      c.save(); c.globalAlpha *= fa; c.fillStyle = C.ink3;
      c.fillRect(cx - 12, cy, 25, 1); c.fillRect(cx, cy - 12, 1, 25); c.restore();
      txt(c, '固定构图', x + 12, FRAME.y + 28, { size: 16, color: C.ink2, alpha: fa });
    }
    m.lines.forEach((s, j) => {
      const la = A * P(l, t0 + 0.6 + j * 0.15, t0 + 1.0 + j * 0.15);
      txt(c, s, x, 772 + j * 40, { size: 22, color: j === 2 ? C.ink3 : C.ink2, alpha: la });
    });
  });
}

// ---- the frame -------------------------------------------------------------------------------
function frame(c, u, t) {
  [shot1, shot2, shot3].forEach((draw, i) => {
    const A = shotA(t, i);
    if (A > 0) draw(c, t, A);
  });
}

// ---- sound -----------------------------------------------------------------------------------
// Effects only, no music (lib/sound.js); every cue sits on a beat of the picture above.
// When an eased move (P's inout3) reaches y, for the ticks that follow the growing bars.
const inv3 = (y) => (y < 0.5 ? Math.cbrt(y / 4) : 1 - Math.cbrt(2 * (1 - y)) / 2);
// How hard the hand shakes, 0..1, from the same sum of sines the picture uses.
const shakeSpeed = (t) => {
  const h = 1 / 480, a = shake(t - h, 1), b = shake(t + h, 1);
  return Math.min(1, Math.hypot(b.x - a.x, b.y - a.y) / (2 * h) / 11);
};
const barTicks = (i) => {
  const t0 = T[1] + 0.3 + i * 1.1 + 0.5, m = COMPARE[i], pan = i ? 0.25 : -0.55;
  return [...Array(Math.floor(m.stops))].map((_, k) => ['tick', t0 + 0.7 * inv3((k + 1) / m.stops),
    { gain: k === 4 && m.self ? 0.06 : 0.035, tone: 2400 + k * 120, pan: pan + k * 0.05 }]);
};
const SFX = [
  ['air', 0, { gain: 0.018 }],

  // 1 · settings: the list ticks in on the left, the mount lands on the right and shakes in the hand,
  // and under it the stabiliser whispers as it holds the sensor still.
  ['whoosh', 0.05, { dur: 0.9, from: 110, to: 800, gain: 0.14, pan: [-0.5, -0.2, 0.9] }],
  ...SETTINGS.map((_, i) => ['tick', 0.37 + i * 0.12, { gain: 0.04, tone: 2600 + i * 140, pan: -0.55 }]),
  ['thump', 0.42, { gain: 0.3, pan: 0.45 }],
  ['rumble', 1.0, { until: T[1] + 0.1, gain: 0.13, pan: 0.45, level: (t) => shakeSpeed(t) * P(t, 1.0, 1.6) * shotA(t, 0) }],
  ['servo', 1.0, { until: T[1] + 0.1, gain: 0.02, pan: 0.45, level: (t) => shakeSpeed(t) * P(t, 1.0, 1.6) * shotA(t, 0) }],

  // 1 → 2
  ['whoosh', T[1] - 0.5, { dur: 0.8, from: 280, to: 2200, gain: 0.2, pan: [0.5, -0.5, 0.8] }],

  // 2 · body alone, then body and lens: each photo set down, each number lands, a tick per stop as
  // the bars grow; 6.5 gets the bigger hit, with a short build into it.
  ['thump', T[1] + 0.45, { gain: 0.26, pan: -0.5 }],
  ['hit', T[1] + 0.7, { gain: 0.5, low: 48, pan: -0.3, tail: 1.1 }],
  ...barTicks(0),
  ['thump', T[1] + 1.55, { gain: 0.26, pan: 0.45 }],
  ['riser', T[1] + 1.3, { dur: 0.5, gain: 0.1, pan: 0.3 }],
  ['hit', T[1] + 1.8, { gain: 0.9, low: 38, pan: 0.3, tail: 1.8 }],
  ...barTicks(1),
  ['tick', T[1] + 2.5, { gain: 0.06, tone: 4200, pan: 0.45 }],

  // 2 → 3
  ['whoosh', T[2] - 0.5, { dur: 0.8, from: 260, to: 2000, gain: 0.2, pan: [0.5, -0.5, 0.8] }],

  // 3 · electronic stabilisation: the picture keeps shaking inside its frame. Boost: the frame locks.
  ['thump', T[2] + 0.5, { gain: 0.22, pan: -0.5 }],
  ['rumble', T[2] + 1.1, { until: DURATION, gain: 0.1, pan: -0.5, level: (t) => shakeSpeed(t) * P(t, T[2] + 1.1, T[2] + 1.6) }],
  ['hit', T[2] + 0.85, { gain: 0.35, low: 58, pan: 0.45, tail: 0.7 }],
  ['latch', T[2] + 0.87, { gain: 0.08, pan: 0.45 }],
  ...MODES.flatMap((m, i) => m.lines.map((_, j) => ['tick', T[2] + 0.3 + i * 0.35 + 0.6 + j * 0.15, { gain: 0.03, tone: 2800, pan: i ? 0.4 : -0.5 }])),
];

// ---- run ------------------------------------------------------------------------------------
S5.run({
  name: 's5-ep5',
  duration: DURATION,
  shots: [[0, DURATION, frame]],
  vo: [],
  beats: BEATS,
  images: window.S5_CAMERAS,
  sfx: SFX,
  label: (t) => (t < T[1] ? 'A 防抖设置' : t < T[2] ? 'B 6.5 档' : 'C 电子防抖与 Boost'),
});
</script>
</body>
</html>
