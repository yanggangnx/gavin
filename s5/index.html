<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松下 S5 · 十秒证据镜头</title>
<style>
  :root {
    --bg: #08090b;
    --panel: #111317;
    --line: #262a31;
    --ink: #e8e5de;
    --ink-2: #9a9da4;
    --ink-3: #5f636b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
  #app { max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; }
  #viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #stage { width: 100%; height: 100%; display: block; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 14px; }
  #controls button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #tc { font: 500 15px "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-2); min-width: 9.5em; }
  #scrub-wrap { position: relative; flex: 1 1 420px; height: 28px; }
  #scrub { width: 100%; margin: 0; position: absolute; top: 6px; accent-color: #9a9da4; }
  .beat { position: absolute; top: 0; width: 1px; height: 8px; background: var(--ink-3); }
  .beat span { position: absolute; top: -18px; left: 3px; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  label { color: var(--ink-2); user-select: none; }
  body.render #app { max-width: none; padding: 0; }
  body.render #viewport { width: 1920px; height: 1080px; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport"><canvas id="stage" width="1920" height="1080"></canvas></div>
  <div id="controls">
    <button id="play">播放</button>
    <span id="tc">00:00:00:00</span>
    <div id="scrub-wrap"><input id="scrub" type="range" min="0" max="10" step="0.0416667" value="0"></div>
    <label><input type="checkbox" data-opt="greybox"> 灰盒</label>
    <label><input type="checkbox" data-opt="guide"> 朗读提示</label>
    <label><input type="checkbox" data-opt="letterbox" checked> 2.39:1 遮幅</label>
    <label><input type="checkbox" data-opt="grain" checked> 颗粒</label>
    <label><input type="checkbox" data-opt="mb"> 运动模糊</label>
  </div>
</div>
<script src="fonts/fonts.js"></script>
<script src="data/sample.js"></script>
<script src="build/cards.js"></script>
<script>
'use strict';
// 10-second evidence shot for the LUMIX S5 voice-over. Every frame is a pure function of t:
// render(t) draws the canvas from scratch, nothing advances on its own, and the grain is seeded,
// so any frame can be redrawn exactly. Sources for every on-screen number: evidence/ledger.csv.

const W = 1920, H = 1080, FPS = 24, DURATION = 10;
const LB = Math.round((H - W / 2.39) / 2);       // 2.39:1 letterbox bar height, 138 px

const C = {
  bg: '#0b0c0e', card: '#121418', line: '#2a2e35',
  ink: '#e8e5de', ink2: '#9a9da4', ink3: '#5f636b',
  accent: '#c4392b',                              // used once: the "1" that goes out
};
const F = {
  serif: '"S5 Serif", "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif',
  sans: '"S5 Sans", "Noto Sans SC", "PingFang SC", sans-serif',
  mono: '"S5 Mono", "S5 Sans", "IBM Plex Mono", ui-monospace, monospace',   // CJK in mono lines falls back to S5 Sans
};

// Timeline in seconds. Without a recorded voice-over these follow an estimated read of about
// five syllables a second (s5/README.md); move them here to retime the cut.
const T = {
  s1: 0,        // 六年
  s2: 0.95,     // 足够让 4K 从旗舰卖点……
  s2b: 2.75,    // ……变成基础配置
  s3: 4.45,     // 也足够让一台 14000 元的机身
  s4: 7.5,      // 掉到现在
  kill: 8.25,   // 只剩个：the "1" goes out
  close: 8.5,   // the gap closes, ¥3,998 stands on its own (零头)
  roll: 9.25,   // the last digits roll down to the median
  land: 9.6,
  end: DURATION,
};
const VO = [
  [0.20, 0.62, '六年，'],
  [0.95, 4.15, '足够让 4K 从旗舰卖点变成基础配置，'],
  [4.45, 7.25, '也足够让一台 14000 元的机身，'],
  [7.50, 9.30, '掉到现在只剩个零头。'],
];
const BEATS = [[0.20, '六年'], [1.55, '4K'], [3.35, '基础配置'], [5.65, '一万四'], [7.50, '掉'], [8.90, '零头']];

// ---- data ------------------------------------------------------------------------------------
const LAUNCH = 13998;                            // 国行官方定价，单机身 (ledger L05)
const ODD = LAUNCH % 10000;                      // 3998: what is left once the "1" is gone
const START = Date.UTC(2020, 8, 2);              // LUMIX S5 发布 (L01)
const SHOT = Date.UTC(2026, 9, 26);              // 闲鱼截图 (L06)
const DAYS = Math.round((SHOT - START) / 864e5);
const SAMPLE = (window.S5_SAMPLE || []).slice().sort((a, b) => a.price - b.price || a.id.localeCompare(b.id));
const MID = SAMPLE[(SAMPLE.length - 1) >> 1] || { id: '', price: ODD };
const MEDIAN = SAMPLE.length % 2 ? MID.price
  : (SAMPLE[SAMPLE.length / 2 - 1].price + SAMPLE[SAMPLE.length / 2].price) / 2;

const SLIPS = [
  {
    src: '4K SHOOTERS', date: '2020.09.02', subject: 'LUMIX S5',
    title: 'Panasonic DC-S5 announced an entry level full frame camera that shoots 4K UHD up to 60fps',
    hl: '4K UHD up to 60fps',
    url: '4kshooters.net/2020/09/02/panasonic-dc-s5-announced-…',
  },
  {
    src: '4K SHOOTERS', date: '2020.10.14', subject: 'IPHONE 12 PRO',
    title: 'Apple iPhone 12 Shoots 4K 10-bit HDR Video Up to 60fps',
    hl: '4K 10-bit HDR Video Up to 60fps',
    note: '60fps 杜比视界仅 iPhone 12 Pro / Pro Max，标准版限 30fps',
    url: '4kshooters.net/2020/10/14/apple-iphone-12-pro-shoots-4k-10-bit-…',
  },
];
const SPEC_ROW = ['4K Dolby Vision video recording at', '24 fps, 25 fps, 30 fps, or 60 fps'];
const HEADLINES = [                               // real titles, used as out-of-focus texture behind the price
  '松下发布全画幅相机LUMIX S5：售价13998元、国行优惠2000元',
  '入门全幅搅局者 松下LUMIX S5评测',
  '13998 元 → 5948 元：松下 LUMIX S5 全画幅微单 618 国补探新低',
];

// ---- options ---------------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const flag = (k, d) => (params.has(k) ? params.get(k) !== '0' : d);
const OPT = {
  render: params.has('render'),
  greybox: flag('greybox', false),
  guide: flag('guide', false),
  letterbox: flag('letterbox', true),
  grain: flag('grain', true),
  mb: flag('mb', false),
};

// ---- helpers ---------------------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  out3: (p) => 1 - (1 - p) ** 3,
  inout3: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
  outExpo: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
};
const P = (t, a, b, e = E.inout3) => e(clamp((t - a) / (b - a)));
const fmt = (n) => Math.round(n).toLocaleString('en-US');
let FRAME_T = 0;                                 // the frame's own time; counters use it so motion blur never mixes two numbers

function mix(a, b, p) {
  const h = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
  const x = h(a), y = h(b);
  return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], p))).join(',')})`;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function font(c, size, weight, family) { c.font = `${weight} ${size}px ${family}`; }

function txt(c, s, x, y, o = {}) {
  if (!s || (o.alpha ?? 1) <= 0) return 0;
  c.save();
  font(c, o.size || 20, o.weight || 400, o.family || F.sans);
  c.fillStyle = o.color || C.ink;
  c.globalAlpha *= o.alpha ?? 1;
  c.textAlign = o.align || 'left';
  c.textBaseline = 'alphabetic';
  c.letterSpacing = `${o.ls || 0}px`;
  if (o.blur > 0.05) c.filter = `blur(${o.blur}px)`;
  c.fillText(s, x, y);
  const w = c.measureText(s).width;
  c.restore();
  return w;
}

function line(c, x0, y0, x1, y1, color, width = 1, alpha = 1) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  c.strokeStyle = color; c.lineWidth = width;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.restore();
}

function dot(c, x, y, r, color, alpha = 1, ring = 2) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  c.fillStyle = C.bg;
  c.beginPath(); c.arc(x, y, r + ring, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.restore();
}

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.roundRect(x, y, w, h, r);
}

function camera(c, s, dx = 0, dy = 0) {
  c.translate(W / 2 + dx, H / 2 + dy); c.scale(s, s); c.translate(-W / 2, -H / 2);
}

// Word-wrap a Latin headline; words inside the highlight span are marked.
function wrapWords(c, text, hl, maxW) {
  const start = text.indexOf(hl), end = start + hl.length;
  const out = [[]];
  let x = 0, pos = 0;
  const space = c.measureText(' ').width;
  for (const w of text.split(' ')) {
    const ww = c.measureText(w).width;
    if (x > 0 && x + ww > maxW) { out.push([]); x = 0; }
    out[out.length - 1].push({ w, x, ww, on: start >= 0 && pos >= start && pos < end });
    x += ww + space;
    pos += w.length + 1;
  }
  return out;
}

// ---- assets ----------------------------------------------------------------------------------
const IMG = {};
let GRAIN = [];

function buildGrain() {
  // Four seeded noise tiles; the frame number picks one, so grain moves but stays reproducible.
  let s = 0x5eed5;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  GRAIN = [0, 1, 2, 3].map(() => {
    const t = makeCanvas(512, 512), g = t.getContext('2d');
    const im = g.createImageData(512, 512);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = 128 + ((rnd() + rnd() + rnd() - 1.5) * 90) | 0;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return t;
  });
}

const ready = (async () => {
  if (window.S5_FONTS) {
    await Promise.all(window.S5_FONTS.map(async (f) => {
      const face = new FontFace(f.family, `url(${f.src})`, { weight: f.weight });
      document.fonts.add(await face.load());
    }));
  }
  await document.fonts.ready;
  const cards = window.S5_CARDS || {};
  await Promise.all(Object.entries(cards).map(([id, src]) => new Promise((res) => {
    const im = new Image();
    im.onload = () => { IMG[id] = im; res(); };
    im.onerror = res;
    im.src = src;
  })));
  buildGrain();
})();

// ---- shot 1 · 六年 ----------------------------------------------------------------------------
function shot1(c, t) {
  c.save();
  camera(c, lerp(1, 1.025, t / (T.s2 - T.s1)));
  const x0 = 300, x1 = 1620, y = 610;
  const d = P(t, 0.02, 0.62, E.out3);
  const head = lerp(x0, x1, d);

  line(c, x0, y, x1, y, C.line, 1);
  line(c, x0, y, head, y, C.ink2, 1.5);
  for (let yr = 2021; yr <= 2026; yr++) {
    const x = lerp(x0, x1, (Date.UTC(yr, 0, 1) - START) / (SHOT - START));
    const lit = head >= x;
    line(c, x, y - 9, x, y + 9, lit ? C.ink2 : C.line, 1);
    txt(c, String(yr), x, y + 44, { family: F.mono, size: 19, color: lit ? C.ink2 : C.ink3, align: 'center' });
  }
  dot(c, x0, y, 5, C.ink);
  txt(c, 'LUMIX S5 发布', x0, y - 72, { size: 20, color: C.ink3 });
  txt(c, '2020.09.02', x0, y - 34, { family: F.mono, size: 26, weight: 500, color: C.ink });

  const endIn = P(t, 0.5, 0.72);
  if (d < 1) dot(c, head, y, 4, C.ink, 1 - endIn);
  dot(c, x1, y, 5, C.ink, endIn);
  txt(c, '闲鱼截图', x1, y - 72, { size: 20, color: C.ink3, align: 'right', alpha: endIn });
  txt(c, '2026.10.26', x1, y - 34, { family: F.mono, size: 26, weight: 500, color: C.ink, align: 'right', alpha: endIn });

  const n = fmt(DAYS * P(FRAME_T - T.s1, 0.04, 0.7, E.outExpo));
  font(c, 128, 500, F.mono);
  const nw = c.measureText(fmt(DAYS)).width;
  font(c, 44, 400, F.sans);
  const uw = c.measureText('天').width;
  const left = W / 2 - (nw + 18 + uw) / 2;
  const a = P(t, 0, 0.12, E.lin);
  txt(c, n, left + nw, 440, { family: F.mono, size: 128, weight: 500, color: C.ink, align: 'right', alpha: a });
  txt(c, '天', left + nw + 18, 440, { size: 44, color: C.ink2, alpha: a });
  c.restore();
}

// ---- shot 2 · 4K: 2020 headline → 2026 spec line ----------------------------------------------
const SLIP_X = 150, SLIP_W = 840;

function slip(c, s, y, o) {
  if (o.alpha <= 0) return 0;
  c.save();
  c.globalAlpha *= o.alpha;
  c.translate(o.dx || 0, 0);
  if (o.blur > 0.05) c.filter = `blur(${o.blur}px)`;
  font(c, 31, 600, F.serif);
  const lines = wrapWords(c, s.title, s.hl, SLIP_W - 72);
  const h = 74 + lines.length * 44 + (s.note ? 40 : 0) + 46;

  rrect(c, SLIP_X, y, SLIP_W, h, 10);
  c.fillStyle = C.card; c.fill();
  c.strokeStyle = C.line; c.lineWidth = 1; c.stroke();

  txt(c, `${s.src} · ${s.date} · ${s.subject}`, SLIP_X + 36, y + 46, { family: F.mono, size: 16, color: C.ink3, ls: 2 });
  let ly = y + 98;
  for (const row of lines) {
    row.forEach((w, i) => {
      const x = SLIP_X + 36 + w.x;
      txt(c, w.w, x, ly, { family: F.serif, size: 31, weight: 600, color: w.on ? C.ink : C.ink2 });
      const next = row[i + 1];
      if (w.on) line(c, x, ly + 9, next && next.on ? SLIP_X + 36 + next.x : x + w.ww, ly + 9, C.ink2, 1);
    });
    ly += 44;
  }
  if (s.note) { txt(c, s.note, SLIP_X + 36, ly + 4, { size: 19, color: C.ink3 }); ly += 40; }
  txt(c, s.url, SLIP_X + 36, ly + 6, { family: F.mono, size: 15, color: C.ink3, alpha: 0.8 });
  c.restore();
  return h;
}

const PANEL = { x: 560, y: 236, w: 800, h: 622 };
const ROW_Y = PANEL.y + 380, ROW_X = PANEL.x + 210;   // baseline of the video row (5th row)

function specPanel(c, a, hl) {
  if (a <= 0) return;
  const { x, y, w, h } = PANEL;
  c.save();
  c.globalAlpha *= a;
  c.translate(0, (1 - a) * 24);
  rrect(c, x, y, w, h, 12);
  c.fillStyle = C.card; c.fill();
  c.strokeStyle = C.line; c.lineWidth = 1; c.stroke();

  txt(c, 'iPhone 17e', x + 44, y + 78, { family: F.serif, size: 52, weight: 600, color: C.ink });
  txt(c, '技术规格', x + w - 44, y + 78, { size: 22, color: C.ink3, align: 'right' });
  txt(c, '2026 · APPLE 在售最便宜的 IPHONE', x + 44, y + 118, { family: F.mono, size: 16, color: C.ink3, ls: 2 });
  line(c, x + 44, y + 146, x + w - 44, y + 146, C.line, 1);

  // Other rows of the spec sheet stay unreadable on purpose: bars, not invented text.
  const bars = [[72, 380], [56, 300], [88, 430], [64, 260], null, [80, 340], [60, 410], [70, 290]];
  let ry = y + 196;
  for (const b of bars) {
    if (!b) {
      c.save();
      c.globalAlpha *= hl * 0.06;
      c.fillStyle = C.ink; c.fillRect(x + 24, ry - 38, w - 48, 92);
      c.restore();
      txt(c, '视频拍摄', x + 44, ry, { size: 20, color: C.ink3 });
      ry += 92;
      continue;
    }
    c.fillStyle = C.line;
    rrect(c, x + 44, ry - 12, b[0], 12, 3); c.fill();
    rrect(c, ROW_X, ry - 12, b[1], 12, 3); c.fill();
    ry += 46;
  }
  txt(c, 'support.apple.com/126470 · iPhone 17e – Tech Specs', x + 44, y + h - 30, { family: F.mono, size: 15, color: C.ink3 });
  c.restore();
}

function specRowText(c, a) {
  txt(c, SPEC_ROW[0], ROW_X, ROW_Y, { size: 23, color: C.ink, alpha: a });
  txt(c, SPEC_ROW[1], ROW_X, ROW_Y + 34, { size: 23, color: C.ink, alpha: a });
}

function shot2(c, t) {
  const tb = T.s2b - T.s2, dur = T.s3 - T.s2;
  c.save();
  camera(c, lerp(1, 1.03, t / dur));

  // Part A: the 2020 headlines, and the spec they lead with.
  const out = P(t, tb - 0.1, tb + 0.45);
  txt(c, '2020', SLIP_X, 206, { family: F.mono, size: 22, weight: 500, color: C.ink2, ls: 4, alpha: P(t, 0, 0.3) * (1 - out) });
  const h1 = slip(c, SLIPS[0], 236, { alpha: P(t, 0.02, 0.4) * (1 - out), blur: out * 8, dx: -out * 80 });
  slip(c, SLIPS[1], 236 + (h1 || 250) + 28, { alpha: P(t, 0.22, 0.6) * (1 - out), blur: out * 8, dx: -out * 80 });

  // Part B: the same spec as one line on the cheapest iPhone of 2026.
  const panelIn = P(t, tb + 0.05, tb + 0.6, E.out3);
  const land = P(t, tb + 0.7, tb + 0.92);
  specPanel(c, panelIn, P(t, tb + 0.85, tb + 1.15));

  // The token: big on the right in 2020, flies into the spec row and becomes that line.
  const tokIn = P(t, 0.3, 0.75, E.out3);
  const fly = P(t, tb, tb + 0.85, E.inout3);
  txt(c, '2020 · 发布会主打规格', 1110, 392, { size: 24, color: C.ink2, alpha: tokIn * (1 - P(t, tb - 0.1, tb + 0.2)) });
  const s = lerp(1, 0.155, fly);
  const tx = lerp(1110, ROW_X, fly), ty = lerp(560, ROW_Y + (1 - panelIn) * 24, fly);
  c.save();
  c.translate(tx, ty); c.scale(s, s);
  const ta = tokIn * (1 - land);
  txt(c, '4K 60p', 0, 0, { family: F.serif, size: 150, weight: 700, color: C.ink, alpha: ta });
  txt(c, '10-bit', 0, 156, { family: F.serif, size: 150, weight: 700, color: C.ink, alpha: ta * (1 - P(fly, 0, 0.45)) });
  c.restore();
  specRowText(c, land * panelIn);
  c.restore();
}

// ---- shots 3 + 4 · ¥13,998 → ¥3,998 → median ---------------------------------------------------
function priceGlyphs(c, size) {
  font(c, size, 700, F.serif);
  const d = c.measureText('0').width;
  return [
    { ch: '¥', w: c.measureText('¥').width + size * 0.05 },
    { ch: '1', w: d, kill: true },
    { ch: '3', w: d, digit: 0 },
    { ch: ',', w: c.measureText(',').width * 1.15 },
    { ch: '9', w: d, digit: 1 },
    { ch: '9', w: d, digit: 2 },
    { ch: '8', w: d, digit: 3 },
  ];
}

function price(c, t, cx, by, size) {
  const g = priceGlyphs(c, size);
  const kill = P(t, T.kill, T.kill + 0.32, E.inout3);
  const close = P(t, T.close, T.close + 0.32, E.inout3);
  const roll = P(t, T.roll, T.land, E.inout3);
  const from = String(ODD), to = String(Math.round(MEDIAN)).padStart(4, '0');
  g[1].w *= 1 - close;
  let x = cx - g.reduce((s, q) => s + q.w, 0) / 2;

  g.forEach((q, i) => {
    const appear = P(t, T.s3 + 0.1 + i * 0.05, T.s3 + 0.55 + i * 0.05, E.out3);
    const base = { family: F.serif, size, weight: 700, color: C.ink, align: 'left' };
    const yy = by + (1 - appear) * 14;
    const blur = (1 - appear) * 10;
    if (q.kill) {
      const heat = P(t, T.kill - 0.14, T.kill + 0.04);
      if (kill < 1) {
        c.save();
        if (heat > 0) { c.shadowColor = C.accent; c.shadowBlur = size * 0.18 * heat * (1 - kill); }
        txt(c, q.ch, x, yy, { ...base, color: mix(C.ink, C.accent, heat), alpha: appear * (1 - kill), blur: blur + kill * size * 0.04 });
        c.restore();
      }
    } else if (q.digit != null && roll > 0) {
      const fd = +from[q.digit], td = +to[q.digit];
      const steps = (fd - td + 10) % 10;
      const pos = roll * steps, k = Math.floor(pos), f = pos - k;
      const cur = (fd - k + 10) % 10, nxt = (cur + 9) % 10;
      const gap = size * 0.92, top = size * 0.86, hh = size * 1.02, ww = Math.ceil(q.w + 16);
      const buf = ROLL_BUF.getContext('2d');
      buf.setTransform(1, 0, 0, 1, 0, 0);
      buf.clearRect(0, 0, ROLL_BUF.width, ROLL_BUF.height);
      txt(buf, String(cur), 8, top + f * gap, base);
      if (f > 0) txt(buf, String(nxt), 8, top - (1 - f) * gap, base);
      const m = buf.createLinearGradient(0, 0, 0, hh);
      m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.16, '#000'); m.addColorStop(0.86, '#000'); m.addColorStop(1, 'rgba(0,0,0,0)');
      buf.globalCompositeOperation = 'destination-in';
      buf.fillStyle = m; buf.fillRect(0, 0, ww, hh);
      buf.globalCompositeOperation = 'source-over';
      c.drawImage(ROLL_BUF, 0, 0, ww, hh, x - 8, yy - top, ww, hh);
    } else {
      txt(c, q.ch, x, yy, { ...base, alpha: appear, blur });
    }
    x += q.w;
  });
}

const ROLL_BUF = makeCanvas(320, 400);            // scratch canvas for one rolling digit
const AX = { x0: 380, x1: 1540, y: 612, lo: 3300, hi: 4300 };
const xOf = (p) => lerp(AX.x0, AX.x1, (p - AX.lo) / (AX.hi - AX.lo));
const CARD = { w: 96, gap: 10, top: 694 };

function cardLayout() {
  const n = SAMPLE.length;
  const total = n * CARD.w + (n - 1) * CARD.gap;
  return SAMPLE.map((s, i) => ({ ...s, x: W / 2 - total / 2 + i * (CARD.w + CARD.gap) }));
}

function evidence(c, t) {
  const a0 = T.s4 + 0.25;
  if (t < a0) return;
  const axis = P(t, a0, a0 + 0.5, E.out3);
  const mid = P(t, T.roll + 0.05, T.land, E.inout3);

  // Price axis: hairline, recessive ticks.
  line(c, AX.x0, AX.y, lerp(AX.x0, AX.x1, axis), AX.y, C.line, 1);
  for (let p = 3400; p <= 4200; p += 200) {
    const x = xOf(p);
    line(c, x, AX.y, x, AX.y + 6, C.line, 1, axis);
    txt(c, fmt(p), x, AX.y + 30, { family: F.mono, size: 15, color: C.ink3, align: 'center', alpha: axis });
  }

  // The odd 3,998 as a reference line once it stands on its own.
  const ref = P(t, T.close, T.close + 0.3);
  line(c, xOf(ODD), AX.y - 30, xOf(ODD), AX.y + 6, C.ink2, 1, ref);
  txt(c, fmt(ODD), xOf(ODD), AX.y - 40, { family: F.mono, size: 16, weight: 500, color: C.ink2, align: 'center', alpha: ref });

  const cards = cardLayout();
  const seen = {};
  cards.forEach((s, i) => {
    const a = P(t, a0 + 0.08 + i * 0.03, a0 + 0.48 + i * 0.03, E.out3);
    const isMid = s.id === MID.id;
    const im = IMG[s.id];
    const ch = im ? CARD.w * im.height / im.width : 170;
    const lift = isMid ? mid : 0;
    const cw = CARD.w, chh = ch;
    const cx = s.x + CARD.w / 2, top = CARD.top - lift * 12 + (1 - a) * 18;

    // Dot (stacked when prices repeat) and a hairline down to its card.
    const stack = (seen[s.price] = (seen[s.price] || 0) + 1) - 1;
    const dx = xOf(s.price), dy = AX.y - stack * 13;
    line(c, dx, AX.y + 7, cx, top - 6, isMid ? mix(C.ink3, C.ink2, mid) : C.ink3, 1, a * (isMid ? lerp(0.3, 0.9, mid) : lerp(0.3, 0.14, mid)));
    dot(c, dx, dy, isMid ? lerp(4, 6, mid) : 4, isMid ? mix(C.ink3, C.ink, mid) : C.ink3, a);

    c.save();
    c.globalAlpha *= a * (isMid ? lerp(0.62, 1, mid) : lerp(0.62, 0.38, mid));
    rrect(c, cx - cw / 2, top, cw, chh, 5);
    if (im && !OPT.greybox) {
      c.save(); c.clip(); c.drawImage(im, cx - cw / 2, top, cw, chh); c.restore();
      if (lift > 0) {
        c.save(); c.globalAlpha = a * lift; c.strokeStyle = C.ink; c.lineWidth = 1.5;
        rrect(c, cx - cw / 2 - 4, top - 4, cw + 8, chh + 8, 8); c.stroke(); c.restore();
      }
    } else {
      c.fillStyle = C.card; c.fill(); c.strokeStyle = C.line; c.stroke();
      txt(c, s.id, cx, top + 40, { family: F.mono, size: 15, color: C.ink3, align: 'center' });
      txt(c, fmt(s.price), cx, top + 64, { family: F.mono, size: 15, color: C.ink2, align: 'center' });
    }
    c.restore();
  });

  txt(c, `中位数 ${fmt(MEDIAN)}`, xOf(MEDIAN), AX.y - 40 - 13, { family: F.mono, size: 16, weight: 500, color: C.ink, align: 'center', alpha: mid });
  txt(c, `闲鱼 · 搜索“松下 s5 单机身” · 2026.10.26 22:46 · ${SAMPLE.length} 条单机身挂牌价（已排除套机、其他型号、重复帖）`,
    W / 2, 918, { family: F.mono, size: 15, color: C.ink3, align: 'center', alpha: P(t, a0 + 0.4, a0 + 0.8) });
}

function shot34(c, t) {
  const s3 = P(t, T.s3, T.s4, E.lin), s4 = P(t, T.s4, T.s4 + 0.6);
  c.save();
  camera(c, lerp(1, 1.035, s3) * lerp(1, 0.97, P(t, T.s4, T.end, E.inout3)));

  // Out-of-focus texture: the real 2020 / 2025 headlines about this price.
  const tex = P(t, T.s3, T.s3 + 0.8) * (1 - P(t, T.s4, T.s4 + 0.4));
  HEADLINES.forEach((h, i) => {
    txt(c, h, -200 + i * 260 + (t - T.s3) * (i % 2 ? -14 : 18), [236, 880, 960][i], {
      family: F.serif, size: 70, weight: 600, color: C.ink, alpha: tex * 0.05, blur: 2.5,
    });
  });

  const size = lerp(268, 200, s4), by = lerp(612, 448, s4);
  const lab1 = P(t, T.s3 + 0.15, T.s3 + 0.6) * (1 - P(t, T.kill - 0.05, T.kill + 0.2));
  const lab2 = P(t, T.roll + 0.1, T.land);
  txt(c, 'LUMIX S5 · 国行官方定价 · 单机身', W / 2, by - size * 0.92, { size: 28, weight: 500, color: C.ink2, align: 'center', alpha: lab1, ls: 2 });
  txt(c, '闲鱼二手 · 单机身挂牌价中位数', W / 2, by - size * 0.92, { size: 28, weight: 500, color: C.ink2, align: 'center', alpha: lab2, ls: 2 });
  price(c, t, W / 2, by, size);

  const src = P(t, T.s3 + 0.55, T.s3 + 1.05) * (1 - P(t, T.s4, T.s4 + 0.3));
  line(c, W / 2 - 300, by + 62, W / 2 + 300, by + 62, C.line, 1, src);
  txt(c, '快科技 · 2020.09.02 ·《松下发布全画幅相机LUMIX S5：售价13998元、国行优惠2000元》', W / 2, by + 104,
    { family: F.mono, size: 19, color: C.ink3, align: 'center', alpha: src });
  txt(c, '同题报道：维科号 · OFweek　｜　色影无忌评测 2020.09.07', W / 2, by + 136,
    { family: F.mono, size: 17, color: C.ink3, align: 'center', alpha: src * 0.75 });

  evidence(c, t);
  c.restore();
}

// ---- frame composition -----------------------------------------------------------------------
const SHOTS = [[T.s1, T.s2, shot1], [T.s2, T.s3, shot2], [T.s3, T.end, shot34]];

function drawScene(c, t) {
  c.save();
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, W * 0.6);
  glow.addColorStop(0, 'rgba(255,255,255,0.035)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = glow; c.fillRect(0, 0, W, H);
  const [a, , fn] = SHOTS.find(([s, e]) => t >= s && t < e) || SHOTS[SHOTS.length - 1];
  fn(c, fn === shot34 ? t : t - a);
  c.restore();
}

function post(c, t) {
  const f = Math.round(t * FPS);
  if (!OPT.greybox) {
    const v = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.62);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
    if (OPT.grain && GRAIN.length) {
      // Grain doubles as dither, so the dark gradients survive platform re-encodes without banding.
      c.save();
      c.globalCompositeOperation = 'overlay';
      c.globalAlpha = 0.13;
      const tile = GRAIN[f % GRAIN.length];
      const ox = (f * 197) % 512, oy = (f * 331) % 512;
      for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) c.drawImage(tile, x, y);
      c.restore();
    }
  }
  if (OPT.letterbox) {
    c.fillStyle = '#000';
    c.fillRect(0, 0, W, LB); c.fillRect(0, H - LB, W, LB);
  }
  if (OPT.greybox || OPT.guide) hud(c, t, f);
}

function timecode(f) {
  const ff = f % FPS, s = Math.floor(f / FPS);
  return `00:00:${String(s).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
}

function hud(c, t, f) {
  const shot = t < T.s2 ? 'S1' : t < T.s3 ? 'S2' : t < T.s4 ? 'S3' : 'S4';
  txt(c, `${timecode(f)}  ${shot}  帧 ${f}`, 40, H - 52, { family: F.mono, size: 22, color: C.ink2 });
  const vo = VO.find(([a, b]) => t >= a - 0.05 && t <= b + 0.15);
  if (vo) txt(c, vo[2], W / 2, H - 52, { size: 30, color: C.ink, align: 'center' });
  const beat = BEATS.find(([b]) => Math.abs(t - b) < 1.5 / FPS);
  if (beat) {
    dot(c, W - 60, 70, 9, C.accent, 1, 0);
    txt(c, beat[1], W - 82, 80, { size: 26, color: C.ink, align: 'right' });
  }
  if (OPT.greybox) txt(c, '灰盒预览 · 节拍按估算语速', W - 40, H - 52, { size: 20, color: C.ink3, align: 'right' });
}

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const sceneCanvas = makeCanvas(W, H), accCanvas = makeCanvas(W, H);

function render(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  FRAME_T = t;
  if (OPT.mb && !OPT.greybox) {
    // 180° shutter: average six sub-frames across half a frame, never across a cut.
    const [a, b] = SHOTS.find(([s, e]) => t >= s && t < e) || SHOTS[SHOTS.length - 1];
    const N = 6, shutter = 0.5 / FPS;
    const sc = sceneCanvas.getContext('2d'), ac = accCanvas.getContext('2d');
    for (let k = 0; k < N; k++) {
      drawScene(sc, clamp(t + (k / (N - 1) - 0.5) * shutter, a, b - 1e-4));
      ac.globalAlpha = 1 / (k + 1);
      ac.drawImage(sceneCanvas, 0, 0);
    }
    ac.globalAlpha = 1;
    ctx.drawImage(accCanvas, 0, 0);
  } else {
    drawScene(ctx, t);
  }
  post(ctx, t);
}

// ---- render hook (render.mjs) and preview player ----------------------------------------------
window.__motion = {
  duration: DURATION, fps: FPS, width: W, height: H,
  ready,
  seek: (t) => render(t),
  beats: BEATS, timeline: T,
};

if (OPT.render) {
  document.body.classList.add('render');
} else {
  const play = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let now = 0, playing = false, last = 0;
  const show = () => { render(now); scrub.value = now; tc.textContent = timecode(Math.round(now * FPS)); };
  const wrap = document.getElementById('scrub-wrap');
  for (const [b, name] of BEATS) {
    const m = document.createElement('div');
    m.className = 'beat'; m.style.left = `${(b / DURATION) * 100}%`;
    m.innerHTML = `<span>${name}</span>`;
    wrap.appendChild(m);
  }
  const loop = (ms) => {
    if (!playing) return;
    now += (ms - last) / 1000; last = ms;
    if (now >= DURATION) now = 0;
    show();
    requestAnimationFrame(loop);
  };
  const toggle = () => {
    playing = !playing;
    play.textContent = playing ? '暂停' : '播放';
    if (playing) { last = performance.now(); requestAnimationFrame(loop); }
  };
  play.onclick = toggle;
  scrub.oninput = () => { now = +scrub.value; show(); };
  document.querySelectorAll('[data-opt]').forEach((el) => {
    el.checked = OPT[el.dataset.opt];
    el.onchange = () => { OPT[el.dataset.opt] = el.checked; show(); };
  });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    const step = e.shiftKey ? 1 : 1 / FPS;
    if (e.code === 'ArrowRight') { now = clamp(now + step, 0, DURATION - 1 / FPS); show(); }
    if (e.code === 'ArrowLeft') { now = clamp(now - step, 0, DURATION); show(); }
  });
  ready.then(show);
}
</script>
